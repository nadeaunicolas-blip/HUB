<style>
:root{color-scheme:light;--navy:#1F3A5F;--gold:#8A6D2B;--wine:#7B2D3A;--cream:#F5EFE0;--ink:#222;--grey:#6b6b6b;--line:#e6e1d8;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#FBF9F5;color:var(--ink);padding:14px 16px 60px}
h1{font-size:22px;margin:0 0 2px;color:var(--navy)}

.planbox .pt{font-size:15px;font-weight:500;color:var(--navy);margin-bottom:8px}
.planbox .pr{font-size:12.5px;line-height:1.6;color:var(--ink);margin-bottom:8px}
.folder{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:18px;font-size:12px}
.folder input{flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;color:var(--ink)}
.folder a{background:var(--navy);color:#fff;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:12px;white-space:nowrap}

.card.done{background:#F3F7F2;border-color:#cfe3cf}
.row1{display:flex;gap:10px;align-items:flex-start}
.num{background:var(--navy);color:#fff;font-weight:700;font-size:13px;min-width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tt{font-weight:600;font-size:14.5px}
.hook{color:var(--wine);font-size:12px;margin-top:2px;font-weight:600}
.meta{color:var(--grey);font-size:11px;margin-top:3px}
.fname{color:var(--navy);font-size:11px;margin-top:3px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.checks{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
.date{color:var(--gold);font-size:11px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.linkrow{display:flex;gap:7px;margin-top:9px;align-items:center}
.linkrow input{flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:11.5px;color:var(--ink)}
.bgrow{margin-top:8px;font-size:12px;color:var(--grey);display:flex;align-items:center;gap:6px}
.bgrow select{border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12px;color:var(--ink);background:#fff}
.linkrow a{background:var(--wine);color:#fff;text-decoration:none;padding:5px 9px;border-radius:6px;font-size:11.5px;white-space:nowrap}
.linkrow a.off{opacity:.4;pointer-events:none}
details.blk{margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
details.blk>summary{cursor:pointer;font-size:12px;font-weight:600;padding:7px 10px;background:#faf7f1;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.blk>summary::-webkit-details-marker{display:none}
details.blk .copybtn{background:var(--gold);color:#fff;border:none;border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer}
details.blk pre{margin:0;padding:9px 10px;white-space:pre-wrap;font-family:inherit;font-size:12px;line-height:1.5;color:#333;background:#fff}
.hint{color:var(--grey);font-size:11px;margin-top:14px;line-height:1.5}

<script>
const DATA=[{"id":"1","phase":1,"fr":"Il muro delle amicizie","hook":"IL MURO DELLE AMICIZIE · 300 vini introvabili a Milano","decor":"Décor C","rubrica":"Fondatrice (à épingler)","file":"V01_Muro","script":"Ciao, sono Nico — il francese del vino a Milano.\nQuesto è il mio muro delle amicizie: trecento vini francesi, e dietro ogni bottiglia una persona che conosco.\nPiccoli produttori, amici, incontrati uno per uno nelle loro cantine. Vini che a Milano trovi solo qui.\nIo non vendo etichette: ti racconto le persone e il loro savoir-faire.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Questo è il mio muro delle amicizie 🍷\nTrecento vini francesi, e dietro ogni bottiglia una persona che conosco. Piccoli produttori, amici, incontrati uno per uno nelle loro cantine.\nIo non vendo etichette: ti racconto le persone. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#portaromana #enotecamilano #vinofrancese #vignaioli #ilfrancesedelvino"},{"id":"2","phase":1,"fr":"Le vin de mon ami Mathieu (Domaine de Montmain)","hook":"A MILANO LO CONOSCO SOLO IO","decor":"Décor C","rubrica":"Récurrente — « Il produttore »","file":"V02_Mathieu","script":"Ciao, sono Nico — il francese del vino a Milano.\nQuesto vino, a Milano, lo conosco solo io. Io e i miei clienti.\nLo fa il mio amico Mathieu, in Borgogna, sulle Hautes-Côtes de Nuits: Domaine de Montmain. Piccolo domaine, grande vino.\n« Le Haut du Village » 2023: ciliegia, lampone, fragolina di bosco. La grande Borgogna, alla portata di tutti.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Questo vino, a Milano, lo conosco solo io. Io e i miei clienti 🍷\nLo fa il mio amico Mathieu — Domaine de Montmain, Hautes-Côtes de Nuits. Piccolo domaine, grande vino.\n« Le Haut du Village » 2023: ciliegia, lampone, fragolina di bosco. La grande Borgogna, alla portata di tutti. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#borgogna #vinofrancese #vignaioli #enotecamilano #ilfrancesedelvino"},{"id":"3","phase":1,"fr":"L'unique enoteca 100% française de Milan","hook":"L'UNICA ENOTECA 100% FRANCESE DI MILANO","decor":"Décor C","rubrica":"Ponctuelle","file":"V03_Enoteca","script":"Ciao, sono Nico — il francese del vino a Milano.\nQuesta è l'unica enoteca 100% francese di Milano.\nUn petit bout de France a Porta Romana: intimo, dove si può parlare, assaggiare, prendersi il tempo.\nDietro di me il muro delle amicizie: trecento etichette francesi, ognuna scelta da me. E nel piatto, i migliori formaggi francesi e altre specialità.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"L'unica enoteca 100% francese di Milano 🇫🇷\nUn petit bout de France a Porta Romana: intimo, dove si può parlare, assaggiare, prendersi il tempo.\nDietro di me il muro delle amicizie: 300 etichette francesi, ognuna scelta da me. E nel piatto, i migliori formaggi francesi e altre specialità. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#enotecamilano #winebarmilano #portaromana #vinofrancese #ilfrancesedelvino"},{"id":"4","phase":2,"fr":"Reconnaître un Champagne de vigneron (RM / NM)","hook":"SAI COS'È UN « RM » / RÉCOLTANT MANIPULANT?","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V04_RM-NM","script":"Ciao, sono Nico — il francese del vino a Milano.\nIl tuo Champagne l'ha fatto un vignaiolo o una grande marca? Guarda l'etichetta, in basso, in piccolissimo: due lettere.\nRM: récoltant-manipulant. Ha le sue vigne, fa il suo vino. Un vignaiolo vero.\nNM: négociant-manipulant. Compra le uve. Sono tutte le grandi marche.\nSul mio muro, solo RM. Per questo paghi il vino, non la pubblicità.\nSe vuoi assaggiare dei veri RM, scrivimi in messaggio privato.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Il tuo Champagne l'ha fatto un vignaiolo o una grande marca? 🍾\nGuarda l'etichetta, in basso, in piccolissimo: due lettere.\nRM = récoltant-manipulant: ha le sue vigne, fa il suo vino. Un vignaiolo vero.\nNM = négociant-manipulant: compra le uve — sono tutte le grandi marche.\nSul mio muro, solo RM. Per questo paghi il vino, non la pubblicità. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#champagne #champagnelover #vinofrancese #enotecamilano #ilfrancesedelvino"},{"id":"5","phase":2,"fr":"Pourquoi le Champagne donne mal à la tête","hook":"MAL DI TESTA DOPO LE BOLLICINE?","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V05_MalDiTesta","script":"Ciao, sono Nico — il francese del vino a Milano.\nMal di testa dopo le bollicine? Non è colpa tua: è colpa di cosa hai bevuto.\nZuccheri aggiunti e produzione industriale: ecco i colpevoli.\nDa me gli Champagne sono a basso dosaggio, con meno interventi delle grandi marche.\nVuoi provare uno Champagne che non ti lascia il mal di testa?\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Mal di testa dopo le bollicine? Non è colpa tua 🥂\nZuccheri aggiunti e produzione industriale: ecco i colpevoli.\nDa me gli Champagne sono a basso dosaggio, con meno interventi delle grandi marche.\nVuoi provare uno Champagne che non ti lascia il mal di testa? 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#champagne #bollicine #vinonaturale #enotecamilano #ilfrancesedelvino"},{"id":"6","phase":2,"fr":"Pourquoi tu paies ton Champagne trop cher","hook":"PERCHÉ PAGHI LO CHAMPAGNE TROPPO","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V06_PaghiTroppo","script":"Ciao, sono Nico — il francese del vino a Milano.\nPaghi 60 euro una bottiglia che ne vale 15. Ecco dove finiscono i tuoi soldi.\nNei grandi marchi paghi pubblicità e packaging; nei piccoli produttori paghi la vigna e il vino.\nStesso piacere, metà del prezzo. Da me paghi il vino, non la pubblicità.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Paghi 60€ una bottiglia che ne vale 15 💸\nNei grandi marchi paghi pubblicità e packaging. Nei piccoli produttori paghi la vigna e il vino. Da me paghi il vino, non la pubblicità. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#champagne #vinofrancese #piccoliproduttori #enotecamilano #ilfrancesedelvino"},{"id":"7","phase":2,"fr":"Tu ne sais pas lire une étiquette française","hook":"NON SAI LEGGERE UN'ETICHETTA FRANCESE","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V07_Etichetta","script":"Ciao, sono Nico — il francese del vino a Milano.\nGuardi un'etichetta francese e non capisci niente? Ti costa caro.\nIn Francia non trovi il vitigno ma il luogo: l'« appellation ». « Domaine » è il produttore, « millésime » l'annata.\nImpara tre parole e non ti frega più nessuno.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Guardi un'etichetta francese e non capisci niente? 🇫🇷\nIn Francia non trovi il vitigno ma il luogo: l'« appellation ». Impara tre parole e non ti frega più nessuno. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vinofrancese #borgogna #degustazione #enotecamilano #ilfrancesedelvino"},{"id":"8","phase":2,"fr":"Tu sers le vin à la mauvaise température","hook":"SERVI IL VINO ALLA TEMPERATURA SBAGLIATA","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V08_Temperatura","script":"Ciao, sono Nico — il francese del vino a Milano.\nIl 90% dei milanesi serve il vino alla temperatura sbagliata, e rovina tutto.\nRosso 16-18 gradi, bianco 8-10, bollicine 6-8.\nTroppo caldo sa di alcol, troppo freddo non profuma. Da me è sempre giusto.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Servi il vino alla temperatura sbagliata? Rovini tutto 🌡️\nRosso 16-18°, bianco 8-10°, bollicine 6-8°. Troppo caldo sa di alcol, troppo freddo non profuma. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vino #degustazione #winetips #enotecamilano #ilfrancesedelvino"},{"id":"9","phase":2,"fr":"Tu jettes la moitié de ton vin","hook":"STAI BUTTANDO METÀ DEL TUO VINO","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V09_Conservare","script":"Ciao, sono Nico — il francese del vino a Milano.\nApri una bottiglia, ne bevi metà e butti il resto? Stai buttando soldi.\nTappo, frigo (anche il rosso), via l'aria. La bollicina si salva con un tappo a pressione.\nBianco e bollicine durano due-tre giorni, il rosso di più.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Apri una bottiglia, ne bevi metà e butti il resto? Stai buttando soldi 🍷\nTappo, frigo (anche il rosso), via l'aria. La bollicina si salva con un tappo a pressione. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vino #winetips #degustazione #enotecamilano #ilfrancesedelvino"},{"id":"10","phase":2,"fr":"On t'a menti sur le vin naturel","hook":"VERO O FALSO: IL VINO NATURALE FA MALE?","decor":"Décor A","rubrica":"Récurrente — « Vero o falso »","file":"V10_VeroFalso-Naturale","script":"Ciao, sono Nico — il francese del vino a Milano.\nTutto quello che ti hanno detto sul vino naturale è mezzo falso.\nNon è sempre più sano, e non è tutto « puzzolente ». Fatto bene è pulito e digeribile.\nIl problema non è il naturale: è chi lo fa male.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Tutto quello che ti hanno detto sul vino naturale è mezzo falso ⚡\nNon è sempre più sano, e non è tutto « puzzolente ». Fatto bene è pulito e digeribile. Il problema è chi lo fa male. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vinonaturale #vignaioli #degustazione #enotecamilano #ilfrancesedelvino"},{"id":"11","phase":2,"fr":"Vin français ou italien ?","hook":"VINO FRANCESE O ITALIANO?","decor":"Décor A","rubrica":"Récurrente — « Vero o falso »","file":"V11_FranceseOItaliano","script":"Ciao, sono Nico — il francese del vino a Milano.\nTi diranno che l'italiano batte il francese. La verità è più scomoda.\nNon esiste « il migliore »: l'Italia ha una varietà unica, la Francia secoli di precisione.\nIo amo l'Italia, ma porto la Francia nel bicchiere.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Vino francese o italiano? La verità è scomoda 🇫🇷🇮🇹\nNon esiste « il migliore »: l'Italia ha una varietà unica, la Francia secoli di precisione. Io amo l'Italia, ma porto la Francia nel bicchiere. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vinofrancese #vinoitaliano #degustazione #enotecamilano #ilfrancesedelvino"},{"id":"12","phase":2,"fr":"Bio, biodynamie, naturel : la différence","hook":"BIO, BIODINAMICO, NATURALE: LA DIFFERENZA","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V12_BioBiodinamico","script":"Ciao, sono Nico — il francese del vino a Milano.\n« Bio », « biodinamico », « naturale »: tre parole, e spesso ti vendono fumo.\nBio = regole certificate. Biodinamico = bio più un metodo. Naturale = nessuna certificazione.\nConta da chi compri: da me sai sempre chi c'è dietro.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"« Bio », « biodinamico », « naturale »: tre parole, e spesso ti vendono fumo 🍇\nBio = regole certificate. Biodinamico = bio + un metodo. Naturale = nessuna certificazione. Conta da chi compri. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vinonaturale #biodinamico #vinofrancese #enotecamilano #ilfrancesedelvino"},{"id":"13","phase":2,"fr":"Le mauvais verre gâche ton vin","hook":"IL BICCHIERE SBAGLIATO TI ROVINA IL VINO","decor":"Décor A","rubrica":"Récurrente — « Il francese ti spiega »","file":"V13_Bicchiere","script":"Ciao, sono Nico — il francese del vino a Milano.\nStai bevendo un buon vino nel bicchiere sbagliato? Lo stai buttando.\nLe bollicine nella flûte stretta perdono metà dei profumi: meglio un calice ampio, anche per lo Champagne.\nVieni a provare lo stesso vino in due bicchieri: ti stupisci.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Il bicchiere sbagliato ti sta rovinando il vino 🍷\nLe bollicine nella flûte stretta perdono metà dei profumi. Meglio un calice ampio, anche per lo Champagne. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#champagne #degustazione #winetips #enotecamilano #ilfrancesedelvino"},{"id":"14","phase":2,"fr":"Aperitivo Italie vs France","hook":"APERITIVO: 🇮🇹 vs 🇫🇷","decor":"Décor A","rubrica":"Ponctuelle (humour)","file":"V14_Aperitivo-IT-FR","script":"Ciao, sono Nico — il francese del vino a Milano.\nAperitivo italiano contro aperitivo francese: chi vince? Sono di parte, lo ammetto.\nVoi: spritz e patatine. Io: un calice di bollicine e ci fermiamo a parlare.\nLa verità? Da me vincono tutti e due.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Aperitivo italiano 🇮🇹 vs aperitivo francese 🇫🇷: chi vince?\nVoi: spritz e patatine. Io: un calice di bollicine e ci fermiamo a parlare. Da me vincono tutti e due. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#aperitivomilano #aperitivoportaromana #champagne #cosafareamilano #ilfrancesedelvino"},{"id":"15","phase":3,"fr":"Champagne à 10€","hook":"CHAMPAGNE FRANCESE · 10€ · MILANO 🍾","decor":"Décor B","rubrica":"Récurrente — « Champagne a 10€ »","file":"V15_Champagne10","script":"Ciao, sono Nico — il francese del vino a Milano.\nA Milano lo Champagne al calice te lo fanno pagare 18, 20 euro. Da me? Dieci.\nE non è uno solo: ho decine di Champagne di piccoli produttori a dieci euro al calice.\nIl lusso francese alla portata di tutti: calici da sette euro, Champagne da dieci.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Champagne francese, al calice, a 10€. A Milano 🥂\nHo decine di Champagne di piccoli produttori a dieci euro al calice. Il lusso francese alla portata di tutti: calici da 7€, Champagne da 10€. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#champagne #aperitivomilano #portaromana #enotecamilano #ilfrancesedelvino"},{"id":"16","phase":3,"fr":"3 vins français < 10€ (#1)","hook":"3 VINI FRANCESI SOTTO I 10€","decor":"Décor B","rubrica":"Récurrente — « 3 vini sotto i 10€ » (série)","file":"V16_TreVini","script":"Ciao, sono Nico — il francese del vino a Milano.\nOgni settimana, tre vini francesi sotto i dieci euro al calice. Puntata uno.\nUn bianco della Loira, secco e minerale. Un rosso del Rodano, pepato. Una bollicina di piccolo produttore.\nTre vini, tutti da produttori che tratto solo io a Milano.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Tre vini francesi sotto i 10€ al calice, ogni settimana 🍷 Puntata 1.\nUn bianco della Loira, un rosso del Rodano, una bollicina di piccolo produttore. Tutti da produttori che tratto solo io a Milano. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vinofrancese #aperitivomilano #enotecamilano #portaromana #ilfrancesedelvino"},{"id":"17","phase":3,"fr":"Huîtres + Champagne","hook":"OSTRICHE + CHAMPAGNE · l'abbinamento che nessuno osa","decor":"Décor B","rubrica":"Récurrente — « L'abbinamento »","file":"V17_Ostriche","script":"Ciao, sono Nico — il francese del vino a Milano.\nL'abbinamento che i milanesi sottovalutano: ostrica e Champagne.\nIl salato dell'ostrica, la bollicina che pulisce la bocca. Una magia.\nDa me lo Champagne parte da dieci euro. Ogni giovedì, ostriche e bollicine.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Ostrica + Champagne 🦪🥂 l'abbinamento che i milanesi sottovalutano.\nIl salato dell'ostrica, la bollicina che pulisce la bocca. Una magia. Da me lo Champagne parte da 10€. Ogni giovedì, ostriche e bollicine. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#ostriche #champagne #abbinamento #aperitivomilano #ilfrancesedelvino"},{"id":"18","phase":3,"fr":"Fromage + vin","hook":"STAI ABBINANDO IL FORMAGGIO AL VINO SBAGLIATO","decor":"Décor B","rubrica":"Récurrente — « L'abbinamento »","file":"V18_Formaggio","script":"Ciao, sono Nico — il francese del vino a Milano.\nIl formaggio lo stai abbinando al vino sbagliato. Te lo correggo io.\nCapra e bianco della Loira: il classico che non sbaglia. Erborinato e vino dolce: fidati.\nTagliere francese e calice ti aspettano, da sette euro.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Stai abbinando il formaggio al vino sbagliato 🧀🍷\nCapra e bianco della Loira: il classico che non sbaglia. Erborinato e vino dolce: fidati. Tagliere francese e calice ti aspettano, da 7€. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#formaggio #abbinamento #vinofrancese #aperitivomilano #ilfrancesedelvino"},{"id":"19","phase":3,"fr":"Ouvrir le Champagne sans « boum »","hook":"NON APRIRE PIÙ LO CHAMPAGNE COL BOTTO","decor":"Décor A","rubrica":"Ponctuelle (satisfying)","file":"V19_Sciabolata","script":"Ciao, sono Nico — il francese del vino a Milano.\nNon aprire mai più lo Champagne col botto.\nNon esplode: sospira. Tieni il tappo, gira la bottiglia — non il tappo.\nQuel piccolo « pfff » è il suono fatto bene.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Non aprire mai più lo Champagne col botto 🍾\nLo Champagne non esplode: sospira. Quel piccolo « pfff » è il suono fatto bene. Te lo insegno dal vivo. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#champagne #sciabolata #bollicine #enotecamilano #ilfrancesedelvino"},{"id":"20","phase":3,"fr":"Le secret le mieux gardé de Porta Romana","hook":"IL SEGRETO MEGLIO CUSTODITO DI PORTA ROMANA","decor":"Décor C","rubrica":"Ponctuelle (géo)","file":"V20_Segreto-PortaRomana","script":"Ciao, sono Nico — il francese del vino a Milano.\nIl posto a Porta Romana che i milanesi si tengono per sé.\nIntimo, 100% francese: Champagne al calice a dieci euro e il muro delle amicizie.\nQui si viene per bere bene e parlare, non per farsi vedere. Stasera ti aspetto.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Il posto a Porta Romana che i milanesi si tengono per sé 🤫🍷\nIntimo, 100% francese: Champagne al calice a 10€ e il muro delle amicizie.\nQui si viene per bere bene e parlare, non per farsi vedere. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#portaromana #aperitivoportaromana #dovebereamilano #cosafareamilano #ilfrancesedelvino"},{"id":"21","phase":3,"fr":"Tu attends l'occasion spéciale ?","hook":"ASPETTI L'OCCASIONE SPECIALE?","decor":"Décor A","rubrica":"Ponctuelle (conversion douce)","file":"V21_Occasione","script":"Ciao, sono Nico — il francese del vino a Milano.\nTieni la bottiglia buona per l'occasione speciale? Rischi di non aprirla mai.\nLo Champagne non è solo per Capodanno: un martedì sera con un buon calice è già un'occasione.\nIl vino invecchia, la vita pure. L'occasione speciale è stasera.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Tieni la bottiglia buona per l'occasione speciale? Rischi di non aprirla mai 🥂\nLo Champagne non è solo per Capodanno: un martedì sera con un buon calice è già un'occasione. L'occasione speciale è stasera. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#champagne #aperitivomilano #enotecamilano #portaromana #ilfrancesedelvino"},{"id":"22","phase":4,"fr":"Ce que disent les clients (avis Google)","hook":"COSA DICONO DI NOI (avis réels)","decor":"Décor A","rubrica":"Ponctuelle (preuve sociale)","file":"V22_Recensioni","script":"Ciao, sono Nico — il francese del vino a Milano.\nNon credere a me: leggi cosa scrivono i clienti.\n[Lis 1-2 vrais avis Google à voix haute].\nOgni sera qualcuno scopre questo posto e torna. Il prossimo tavolo può essere il tuo.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Non credere a me: leggi cosa scrivono i clienti ⭐\nOgni sera qualcuno scopre questo posto per la prima volta, e torna. Il prossimo tavolo può essere il tuo. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#enotecamilano #winebarmilano #portaromana #aperitivomilano #ilfrancesedelvino"},{"id":"23","phase":4,"fr":"Le producteur partenaire","hook":"PERCHÉ UN PRODUTTORE FRANCESE SCEGLIE MILANO","decor":"Décor C","rubrica":"Récurrente — « Il produttore » (conversion)","file":"V23_Produttore","script":"Ciao, sono Nico — il francese del vino a Milano.\nPerché un produttore francese affida i suoi vini a una piccola enoteca a Milano?\nPerché non vendo etichette: racconto le persone e il loro savoir-faire.\nUn legame diretto tra la sua vigna e il tuo bicchiere. I suoi vini li trovi solo qui.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Perché un produttore francese affida i suoi vini a una piccola enoteca a Milano? 🍇\nPerché non vendo etichette: racconto le persone e il loro savoir-faire. Un legame diretto tra la sua vigna e il tuo bicchiere. 📩 Scrivimi in privato per prenotare — 📍 Via Cadore 38, Porta Romana, Milano\n\n#vignaioli #vinofrancese #borgogna #enotecamilano #ilfrancesedelvino"},{"id":"24","phase":4,"fr":"B2B — cadeaux d'entreprise & événements","hook":"IL REGALO AZIENDALE CHE NESSUNO DIMENTICA","decor":"Décor B","rubrica":"Saisonnière (avant Noël)","file":"V24_B2B-Regali","script":"Ciao, sono Nico — il francese del vino a Milano.\nIl regalo aziendale che i tuoi clienti non dimenticano non è il solito cesto.\nVini di piccoli produttori francesi, rari e raccontati. Eventi privati e masterclass in enoteca.\nUn'esperienza, non un prodotto.\nPer prenotare: messaggio privato. Ci vediamo alla Vinothèque — Via Cadore 38.","caption":"Il regalo aziendale che i tuoi clienti non dimenticano 🎁🍷\nNon il solito cesto: vini di piccoli produttori francesi, rari e raccontati. Eventi privati e masterclass in enoteca. Un'esperienza, non un prodotto.\n📩 Scrivimi in privato per organizzarlo insieme — 📍 Via Cadore 38, Milano\n\n#regaliaziendali #eventiaziendali #vinofrancese #enotecamilano #ilfrancesedelvino"},{"id":"25","phase":1,"fr":"Les vins des Jeux Olympiques","hook":"LE OLIMPIADI · vini italiani scelti da un francese","decor":"Décor C","rubrica":"TOFU — curiosità / autorità","file":"V25_Olimpiadi","script":"I vini italiani delle Olimpiadi di Milano-Cortina? Li ha scelti un francese. Io.\nSembra assurdo, lo so.\nMa io il buono lo cerco ovunque, senza bandiere. E credetemi: l'Italia, nel bicchiere, non ha niente da invidiare a nessuno.\nIl vino non ha confini. Solo il gusto.","caption":"I vini italiani delle Olimpiadi di Milano-Cortina li ha scelti un francese. Io 🍷\nPerché il vino non ha bandiera.\n📍 Via Cadore 38, Milano\n\n#milanocortina #olimpiadi #vinoitaliano #vinofrancese #ilfrancesedelvino"},{"id":"26","phase":1,"fr":"300 vins, zéro grande marque","hook":"300 VINI · 0 GRANDI MARCHE","decor":"Décor C","rubrica":"TOFU — fatto che sorprende","file":"V26_ZeroMarche","script":"Trecento vini sul mio muro. E nemmeno una grande marca.\nNessun nome da supermercato. Solo piccoli vignaioli, famiglie che vivono sulla loro terra.\nUsano poca chimica non per moda: è casa loro. E nel bicchiere lo senti — sa di vero.\nTrecento etichette. Migliaia di persone dietro.","caption":"Trecento vini, e nemmeno una grande marca 🍷\nSolo piccoli vignaioli. Dietro ogni bottiglia, delle persone — migliaia.\n📍 Via Cadore 38, Milano\n\n#vinonaturale #vignaioli #vinofrancese #portaromana #ilfrancesedelvino"},{"id":"27","phase":2,"fr":"Des avions au vin","hook":"DAGLI AEREI AL VINO","decor":"Décor A","rubrica":"MOFU — parcours","file":"V27_DagliAerei","script":"Ho iniziato negli aerei. Non nel vino.\nLavoravo nell'aviazione d'affari. Lì ho incontrato dei veri appassionati.\nMi ha folgorato un'idea: parlare di ciò che ami, abbinarlo, condividerlo. Ho mollato tutto per il vino.\nQuindici anni dopo, eccomi qui, a Milano.","caption":"Non ho iniziato nel vino. Ho iniziato negli aerei ✈️🍷\nLì ho incontrato dei veri appassionati, e ho mollato tutto per il vino.\n📍 La Vinothèque, Via Cadore 38\n\n#vinofrancese #storia #sommelier #enotecamilano #ilfrancesedelvino"},{"id":"28","phase":2,"fr":"Pureté et fruit","hook":"PUREZZA E FRUTTO","decor":"Décor A","rubrica":"MOFU — filosofia di degustazione","file":"V28_PurezzaFrutto","script":"Quando assaggio un vino, cerco due cose. Solo due.\nPurezza e frutto. Punto.\nNon mi interessa il gergo da sommelier. Parlo da chi ha assaggiato, non da chi ha letto.\nSe un vino è pulito e ha frutto, è sul mio muro.","caption":"Cosa cerco in un vino? Purezza e frutto. Il resto è chiacchiere 🍷\nParlo da chi ha assaggiato, non da chi ha letto.\n📍 La Vinothèque, Via Cadore 38\n\n#degustazione #vinofrancese #sommelier #enotecamilano #ilfrancesedelvino"},{"id":"29","phase":4,"fr":"Masterclass","hook":"MASTERCLASS · posti limitati","decor":"Décor B","rubrica":"BOFU — masterclass","file":"V29_Masterclass","script":"Vuoi capirci davvero qualcosa di vino francese?\nDa noi facciamo masterclass: una regione, un tema, qualche calice.\nNon una lezione noiosa. Assaggi, capisci, ti diverti — con me e i miei sommelier.\nPiccoli gruppi, posti limitati.\nScrivimi in DM per la prossima. Ci vediamo alla Vinothèque, Via Cadore 38.","caption":"Masterclass alla Vinothèque: una regione, qualche calice, zero noia 🍷\nPiccoli gruppi, posti limitati.\n📩 Scrivimi in DM per la prossima — 📍 Via Cadore 38\n\n#masterclass #vinofrancese #aperitivomilano #portaromana #ilfrancesedelvino"}];const I18N={"fr":{"title":"La Vinothèque — Suivi des 29 vidéos","sub":"Coche les étapes, copie le script et la légende, colle le lien du fichier. Tout est sauvegardé automatiquement.","gtitle":"📣 Guide SEO Instagram / Facebook (à lire une fois)","g1":"<b>Publication :</b> publie le reel depuis ton compte perso → utilise la <b>Collab</b> et invite <b>@vinotheque_rsvp</b> : le post apparaît sur les DEUX feeds, et chacun se répercute sur Facebook. Une vidéo, quadruple diffusion.","g2":"<b>Légende :</b> mets l'accroche en <b>1re ligne</b>. Termine par le CTA et la localisation.","g3":"<b>Hashtags :</b> ~5 ciblés = géo local (#portaromana #enotecamilano) + thème (#champagne #vinofrancese) + marque (#ilfrancesedelvino). Le géo local remplit les tables.","sc_title":"🎬 À checker avant de tourner (matos)","sc":["🔋 Chargé : iPhone >50%, gimbal Flow 2 Pro, boîtier LARK au vert","🎤 Micro LARK branché (USB-C), gain 4, pas en mute, test 30s frigos allumés","🎥 Trépied posé, Mode Lock, caméra à hauteur des yeux, format vertical 9:16","🪞 Selfie Flip ON (étiquettes à l'endroit), WB + expo verrouillées, filtre chaud","💾 Stockage iPhone dispo + mode Avion pendant les prises"],"sc_note":"Se réinitialise à chaque ouverture.","pc_title":"✅ À checker avant de poster","pc":["🎣 Hook (texte à l'écran) dès la 1re seconde + regard caméra","📝 Sous-titres relus (« 1x1 » → « uno per uno », fautes)","🎵 Musique soul / funk, volume bas, ajoutée DANS Instagram","🤝 Collab @vinotheque_rsvp + légende + hashtags géo-locaux"],"pc_note":"Se réinitialise à chaque ouverture.","m_title":"🎵 Reco musicales (soul · funk · Motown · reggae)","m":["<b>Nina Simone — Sinnerman</b> → storytelling (le muro, les produttori)","<b>Cymande — Bra / Dove</b> (funk-reggae) → fil rouge groovy","<b>Khruangbin — Maria También</b> → aperitivo & ambiance","<b>Bill Withers / Marvin Gaye</b> (soul) → prix / accessibilité"],"m_note":"Volume bas (~15%), ajoute la musique D const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const SET=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let LANG=LS('vino_lang','fr');
function t(k){return (I18N[LANG]&&I18N[LANG][k]!==undefined)?I18N[LANG][k]:I18N.fr[k];}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyText(txt,btn){const done=()=>{const o=btn.textContent;btn.textContent='✓';setTimeout(()=>btn.textContent=o,1200);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));}else fb(txt,done);}
function fb(txt,cb){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);cb();}
function funnelOf(v){return (v.phase===2)?'MOFU':(v.phase===4)?'BOFU':'TOFU';}
const STAGE_KEYS=['tourne','monte','publie'];

function renderStats(){
  const T=DATA.length;
  const cnt=k=>DATA.filter(v=>LS('vino_v'+v.id+'_'+k,false)).length;
  const t3=cnt('tourne'),m3=cnt('monte'),p3=cnt('publie');
  const pub=f=>DATA.filter(v=>funnelOf(v)===f&&LS('vino_v'+v.id+'_publie',false)).length;
  const tot=f=>DATA.filter(v=>funnelOf(v)===f).length;
  const idsOf=f=>DATA.filter(v=>funnelOf(v)===f).map(v=>v.id).join(', ');
  const bar=(n,c)=>'<div class="pb"><div style="width:'+(n/T*100)+'%;background:'+c+'"></div></div>';
  let h='<div class="dash">';
  h+='<div class="stat"><div class="lbl">'+t('st_t')+'</div><div class="val">'+t3+' <small>/ '+T+'</small></div>'+bar(t3,'#7B2D3A')+'</div>';
  h+='<div class="stat"><div class="lbl">'+t('st_m')+'</div><div class="val">'+m3+' <small>/ '+T+'</small></div>'+bar(m3,'#8A6D2B')+'</div>';
  h+='<div class="stat"><div class="lbl">'+t('st_p')+'</div><div class="val">'+p3+' <small>/ '+T+'</small></div>'+bar(p3,'#3a7d44')+'</div></div>';
  h+='<div class="obj"><h4>'+t('obj_a')+'</h4>';
  [['TOFU','visibilità'],['MOFU','autorità'],['BOFU','conversione']].forEach(a=>{h+='<div class="objrow"><span><b>'+a[0]+'</b> — n° '+idsOf(a[0])+'</span><span class="n">'+pub(a[0])+'/'+tot(a[0])+' '+t('pub')+'</span></div>';});
  h+='</div>';
  h+='<div class="obj"><h4>'+t('obj_l')+'</h4>';
  t('lucas').forEach(a=>{h+='<div class="objrow"><span>'+a[0]+'</span><span class="n" style="font-weight:400;color:var(--grey)">'+a[1]+'</span></div>';});
  h+='</div>';
  const bgs={};DATA.forEach(v=>{const b=LS('vino_v'+v.id+'_bg','');if(b)bgs[b]=(bgs[b]||0)+1;});
  const bgtot=Object.values(bgs).reduce((a,b)=>a+b,0);
  h+='<div class="obj"><h4>'+t('var_t')+'</h4>';
  if(bgtot===0){h+='<div class="fmt" style="color:var(--grey)">'+t('var_e')+'</div>';}
  else{const en=Object.entries(bgs).sort((a,b)=>b[1]-a[1]);en.forEach(x=>{const pct=Math.round(x[1]/bgtot*100);const w=pct>50?' style="color:#7B2D3A;font-weight:500"':'';h+='<div class="objrow"'+w+'><span>'+x[0]+'</span><span class="n">'+x[1]+' ('+pct+'%)</span></div>';});if(en[0][1]/bgtot>0.5){h+='<div class="fmt" style="color:#7B2D3A;margin-top:4px">'+t('var_w').replace('%B',en[0][0])+'</div>';}}
  h+='</div>';
  document.getElementById('stats').innerHTML=h;
}

function buildApp(){
  const app=document.getElementById('app');app.innerHTML='';
  [1,2,3,4].forEach(ph=>{
    const hd=document.createElement('div');hd.className='phase';hd.textContent=t('phases')[ph];app.appendChild(hd);
    DATA.filter(v=>v.phase===ph).forEach(v=>{
      const card=document.createElement('div');card.className='card';
      card.innerHTML='<div class="row1"><div class="num">'+v.id+'</div><div><div class="tt">'+v.fr+'</div><div class="hook">'+v.hook+'</div><div class="meta">'+v.rubrica+'</div><div class="fname">📄 '+v.file+'.mp4</div></div></div>'+
      '<div class="checks"></div>'+
      '<div class="linkrow"><input placeholder="'+t('c_link')+'"><a target="_blank">'+t('c_open')+'</a></div>'+
      '<div class="bgrow">'+t('c_bg')+' <select class="bgsel"></select></div>'+
      '<details class="blk script"><summary><span>'+t('c_script')+'</span><button class="copybtn">'+t('c_copy')+'</button></summary><pre>'+esc(v.script)+'</pre></details>'+
      '<details class="blk cap"><summary><span>'+t('c_cap')+'</span><button class="copybtn">'+t('c_copy')+'</button></summary><pre>'+esc(v.caption)+'</pre></details>';
      const checks=card.querySelector('.checks');
      STAGE_KEYS.forEach((key,i)=>{
        const lab=document.createElement('label');lab.className='chk';
        const cb=document.createElement('input');cb.type='checkbox';cb.checked=LS('vino_v'+v.id+'_'+key,false);
        const dt=document.createElement('span');dt.className='date';const dkey='vino_v'+v.id+'_'+key+'_date';
        const sd=()=>{const d=LS(dkey,'');dt.textContent=d?' · '+d:'';};sd();
        cb.addEventListener('change',()=>{SET('vino_v'+v.id+'_'+key,cb.checked);if(cb.checked){if(!LS(dkey,''))SET(dkey,new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}));}else{SET(dkey,'');}sd();renderStats();if(key==='publie')card.classList.toggle('done',cb.checked);});
        lab.appendChild(cb);lab.appendChild(document.createTextNode(t('stg')[i]));lab.appendChild(dt);checks.appendChild(lab);
      });
      if(LS('vino_v'+v.id+'_publie',false))card.classList.add('done');
      const li=card.querySelector('.linkrow input');const la=card.querySelector('.linkrow a');li.value=LS('vino_v'+v.id+'_link','');
      const rl=()=>{la.href=li.value||'#';la.className=li.value?'':'off';};li.addEventListener('input',()=>{SET('vino_v'+v.id+'_link',li.value);rl();});rl();
      const bg=card.querySelector('.bgsel');t('bg').forEach((o,i)=>{const op=document.createElement('option');op.value=(i===0?'':o);op.textContent=o;bg.appendChild(op);});bg.value=LS('vino_v'+v.id+'_bg','');bg.addEventListener('change',()=>{SET('vino_v'+v.id+'_bg',bg.value);renderStats();});
      card.querySelector('.script .copybtn').addEventListener('click',e=>{e.preventDefault();copyText(v.script,e.target);});
      card.querySelector('.cap .copybtn').addEventListener('click',e=>{e.preventDefault();copyText(v.caption,e.target);});
      app.appendChild(card);
    });
  });
}

function renderAll(){
  document.getElementById('pgtitle').textContent=t('title');
  document.getElementById('pgsub').textContent=t('sub');
  document.getElementById('pghint').textContent=t('hint');
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  renderMid();renderStats();buildApp();
}
document.querySelectorAll('.langbtn').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.l;SET('vino_lang',LANG);renderAll();}));
renderAll();
</script></body></html>
