  [['TOFU','visibilità'],['MOFU','autorità'],['BOFU','conversione']].forEach(a=>{h+='<div class="objrow"><span><b>'+a[0]+'</b> — n° '+idsOf(a[0])+'</span><span class="n">'+pub(a[0])+'/'+tot(a[0])+' '+t('pub')+'</span></div>';});
  h+='</div>';
  h+='<div class="obj"><h4>'+t('obj_l')+'</h4>';
  t('lucas').forEach(a=>{h+='<div class="objrow"><span>'+a[0]+'</span><span class="n" style="font-weight:400;color:var(--grey)">'+a[1]+'</span></div>';});
  h+='</div>';
  const bgs={};DATA.forEach(v=>{const b=LS('vino_v'+v.id+'_bg','');if(b)bgs[b]=(bgs[b]||0)+1;});
  const bgtot=Object.values(bgs).reduce((a,b)=>a+b,0);
  h+='<div class="obj"><h4>'+t('var_t')+'</h4>';
  if(bgtot===0){h+='<div class="fmt" style="color:var(--grey)">'+t('var_e')+'</div>';}
  else{const en=Object.entries(bgs).sort((a,b)=>b[1]-a[1]);en.forEach(x=>{const pct=Math.round(x[1]/bgtot*100);const w=pct>50?' style="color:#7B2D3A;font-weight:500"':'';h+='<div class="objrow"'+w+'><span>'+x[0]+'</span><span class="n">'+x[1]+' ('+pct+'%)</span></div>';});if(en[0][1]/bgtot>0.5){h+='<div class="fmt" style="color:#7B2D3A;margin-top:4px">'+t('var_w').replace('%B',en[0][0])+'</div>';}}
  h+='</div>';
  document.getElementById('stats').innerHTML=h;
}

function renderAgenda(){
  const box=document.getElementById('agenda');if(!box)return;
  const AL={fr:{hd:"📅 Agenda de publication",done:"✅ Déjà publié",next:"🗓️ À publier — dates suggérées",none:"Rien de prêt à poster : tourne d'abord tes vidéos (coche 🎬).",views:"vues",reco:"💡 Cadence conseillée : 2-3 reels/semaine (ex. mardi & vendredi ~19h). Avant tes vacances, tourne un stock et programme-les à l'avance."},
             en:{hd:"📅 Publishing calendar",done:"✅ Already published",next:"🗓️ To publish — suggested dates",none:"Nothing ready: shoot your videos first (tick 🎬).",views:"views",reco:"💡 Suggested cadence: 2-3 reels/week (e.g. Tue & Fri ~7pm). Before your holidays, shoot a stock and schedule them ahead."},
             it:{hd:"📅 Calendario pubblicazioni",done:"✅ Già pubblicati",next:"🗓️ Da pubblicare — date suggerite",none:"Niente di pronto: gira prima i video (spunta 🎬).",views:"visual.",reco:"💡 Cadenza consigliata: 2-3 reel/settimana (es. martedì e venerdì ~19). Prima delle vacanze, gira una scorta e programmali."}};
  const L=AL[LANG]||AL.fr;
  const parseD=s=>{const p=(s||'').split('/');if(p.length!==3)return null;const dt=new Date(2000+ +p[2],+p[1]-1,+p[0]);return isNaN(dt)?null:dt;};
  const fmtD=dt=>dt.toLocaleDateString(LANG==='fr'?'fr-FR':LANG==='it'?'it-IT':'en-GB',{weekday:'short',day:'2-digit',month:'short'});
  // published
  const pubs=DATA.filter(v=>LS('vino_v'+v.id+'_publie',false)).map(v=>({v,d:parseD(LS('vino_v'+v.id+'_publie_date',''))}));
  pubs.sort((a,b)=>(a.d?a.d:0)-(b.d?b.d:0));
  // ready to publish = tourné & !publié
  const ready=DATA.filter(v=>LS('vino_v'+v.id+'_tourne',false)&&!LS('vino_v'+v.id+'_publie',false)&&LS('vino_v'+v.id+'_vote','')!=='down');
  ready.sort((a,b)=>Number(a.id)-Number(b.id));
  // schedule: start from max(lastPub, today)+3d, step 3d
  let last=null;pubs.forEach(p=>{if(p.d&&(!last||p.d>last))last=p.d;});
  const today=new Date();today.setHours(0,0,0,0);
  let start=last&&last>today?new Date(last):new Date(today);
  const step=()=>{start=new Date(start.getTime()+3*86400000);return new Date(start);};
  let h='<div class="secdiv">'+L.hd+'</div><div class="agwrap">';
  h+='<div class="agcol"><h4>'+L.done+' ('+pubs.length+')</h4>';
  if(!pubs.length)h+='<div class="agrow" style="color:var(--grey)">—</div>';
  pubs.forEach(p=>{const dd=p.d?fmtD(p.d):'—';const vv=p.v.views?' · '+p.v.views.toLocaleString('fr-FR')+' '+L.views:'';h+='<div class="agrow"><span class="agd">'+dd+'</span> <b>#'+p.v.id+'</b> '+p.v.fr+'<span class="agv">'+vv+'</span></div>';});
  h+='</div>';
  h+='<div class="agcol"><h4>'+L.next+'</h4>';
  if(!ready.length)h+='<div class="agrow" style="color:var(--grey)">'+L.none+'</div>';
  ready.forEach(v=>{const dt=step();const fn=funnelOf(v);h+='<div class="agrow"><span class="agd sug">≈ '+fmtD(dt)+'</span> <b>#'+v.id+'</b> '+v.fr+' <span class="etg etg-'+fn+'">'+fn+'</span></div>';});
  h+='</div></div><div class="agnote">'+L.reco+'</div>';
  box.innerHTML=h;
}
function buildApp(){
  const app=document.getElementById('app');app.innerHTML='';
  const sorted=filtered();
  if(!sorted.length){app.innerHTML='<div class="empty">Aucune vidéo avec ce filtre.</div>';return;}
  sorted.forEach(v=>{
    const fn=funnelOf(v);
    const card=document.createElement('div');card.className='card';
    card.innerHTML='<div class="row1"><button class="starbtn"></button><div class="num">'+v.id+'</div><div><div class="tt">'+v.fr+'<span class="etg etg-'+fn+'">'+fn+'</span></div><div class="hook">'+v.hook+'</div><div class="meta">'+v.rubrica+'</div><div class="fname">📄 '+v.file+'.mp4</div></div></div>'+
    '<div class="checks"></div>'+'<div class="votes"><label class="vote"><input type="checkbox" class="vup">'+t('vote_up')+'</label><label class="vote"><input type="checkbox" class="vdn">'+t('vote_down')+'</label></div><div class="altbox"></div>'+
    '<div class="linkrow"><input placeholder="'+t('c_link')+'"><a target="_blank">'+t('c_open')+'</a></div>'+
    '<div class="bgrow">'+t('c_bg')+' <select class="bgsel"></select></div>'+
    '<details class="blk chat"><summary><span>💬 '+t('chat_t')+'</span></summary><textarea class="chatin" placeholder="'+t('chat_ph')+'"></textarea><button class="chatbtn">'+t('chat_go')+'</button><div class="chatout"></div></details>'+'<details class="blk script"><summary><span>'+t('c_script')+'</span><button class="copybtn">'+t('c_copy')+'</button></summary><pre>'+esc(v.script)+'</pre></details>'+
    '<details class="blk cap"><summary><span>'+t('c_cap')+'</span><button class="copybtn">'+t('c_copy')+'</button></summary><pre>'+esc(v.caption)+'</pre></details>';
    const checks=card.querySelector('.checks');
    STAGE_KEYS.forEach((key,i)=>{
      const lab=document.createElement('label');lab.className='chk';
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=LS('vino_v'+v.id+'_'+key,!!v.pub);
      const dt=document.createElement('span');dt.className='date';const dkey='vino_v'+v.id+'_'+key+'_date';
      const sd=()=>{const d=LS(dkey,'');if(d){dt.textContent=' · '+d+' ✏️';dt.title='Changer la date';}else if(cb.checked){dt.textContent=' · 📅 +date';dt.title='Ajouter la date manuellement';}else{dt.textContent='';dt.title='';}};sd();
      dt.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(!cb.checked)return;
        const inp=document.createElement('input');inp.type='date';inp.className='dateinp';
        const cur=LS(dkey,'');if(cur){const p=cur.split('/');if(p.length===3)inp.value='20'+p[2]+'-'+p[1]+'-'+p[0];}
        inp.addEventListener('click',ev=>ev.stopPropagation());
        const close=(save)=>{if(save&&inp.value){const q=inp.value.split('-');SET(dkey,q[2]+'/'+q[1]+'/'+q[0].slice(2));}if(inp.isConnected)inp.replaceWith(dt);sd();renderStats();};
        inp.addEventListener('change',()=>close(true));
        inp.addEventListener('blur',()=>close(false));
        inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')close(true);if(ev.key==='Escape')close(false);});
        dt.replaceWith(inp);inp.focus();
      });
      cb.addEventListener('change',()=>{SET('vino_v'+v.id+'_'+key,cb.checked);if(cb.checked){if(!LS(dkey,''))SET(dkey,new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}));}else{SET(dkey,'');}sd();renderStats();if(key==='publie')card.classList.toggle('done',cb.checked);});
      lab.appendChild(cb);lab.appendChild(document.createTextNode(t('stg')[i]));lab.appendChild(dt);checks.appendChild(lab);
    });
    const vup=card.querySelector('.vup'),vdn=card.querySelector('.vdn'),altbox=card.querySelector('.altbox');
    const _v0=LS('vino_v'+v.id+'_vote','');vup.checked=_v0==='up';vdn.checked=_v0==='down';
    const _cat=(v.phase===2)?'MOFU':(v.phase>=3)?'BOFU':'TOFU';
    function showAlt(){
      if(LS('vino_v'+v.id+'_vote','')!=='down'){altbox.style.display='none';altbox.innerHTML='';return;}
      const pool=ALT[_cat]||[];if(!pool.length){altbox.style.display='none';return;}
      let idx=parseInt(LS('vino_v'+v.id+'_altidx','0'))||0;if(idx>=pool.length)idx=0;
      const a=pool[idx];altbox.style.display='block';
      altbox.innerHTML='<div class="althd">'+t('alt_hd')+'</div><div class="alth">'+a.h+'</div><div class="altd">'+a.d+'</div><button class="altmore">'+t('alt_more')+'</button>';
      altbox.querySelector('.altmore').addEventListener('click',function(){let n=(parseInt(LS('vino_v'+v.id+'_altidx','0'))||0)+1;if(n>=pool.length)n=0;SET('vino_v'+v.id+'_altidx',String(n));showAlt();});
    }
    vup.addEventListener('change',function(){if(vup.checked){vdn.checked=false;SET('vino_v'+v.id+'_vote','up');}else{SET('vino_v'+v.id+'_vote','');}showAlt();});
    vdn.addEventListener('change',function(){if(vdn.checked){vup.checked=false;SET('vino_v'+v.id+'_vote','down');}else{SET('vino_v'+v.id+'_vote','');}showAlt();});
    showAlt();
    if(LS('vino_v'+v.id+'_publie',false))card.classList.add('done');
    const li=card.querySelector('.linkrow input');const la=card.querySelector('.linkrow a');li.value=LS('vino_v'+v.id+'_link','');
    const rl=()=>{la.href=li.value||'#';la.className=li.value?'':'off';};li.addEventListener('input',()=>{SET('vino_v'+v.id+'_link',li.value);rl();});rl();
    const bg=card.querySelector('.bgsel');t('bg').forEach((o,i)=>{const op=document.createElement('option');op.value=(i===0?'':o);op.textContent=o;bg.appendChild(op);});bg.value=LS('vino_v'+v.id+'_bg','');bg.addEventListener('change',()=>{SET('vino_v'+v.id+'_bg',bg.value);renderStats();});
    card.querySelector('.script .copybtn').addEventListener('click',e=>{e.preventDefault();copyText(v.script,e.target);});
    card.querySelector('.cap .copybtn').addEventListener('click',e=>{e.preventDefault();copyText(v.caption,e.target);});
    // star / sélection
    const star=card.querySelector('.starbtn');
    const paintStar=()=>{const on=LS('vino_v'+v.id+'_sel',false);star.textContent=on?'★':'☆';star.classList.toggle('on',on);};paintStar();
    star.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();const on=!LS('vino_v'+v.id+'_sel',false);SET('vino_v'+v.id+'_sel',on);paintStar();renderFilters();if(FILTER.sel)buildApp();});
    // chat améliorer avec Claude
    const ci=card.querySelector('.chatin'),cbn=card.querySelector('.chatbtn'),cout=card.querySelector('.chatout');
    ci.value=LS('vino_v'+v.id+'_chatin','');ci.addEventListener('input',()=>SET('vino_v'+v.id+'_chatin',ci.value));
    const showOut=(txt)=>{cout.innerHTML='<pre></pre><button class="copybtn cout">'+t('c_copy')+'</button>';cout.querySelector('pre').textContent=txt;cout.querySelector('.cout').addEventListener('click',e=>{e.preventDefault();copyText(txt,e.target);});};
    const _so=LS('vino_v'+v.id+'_chatout','');if(_so)showOut(_so);
    cbn.addEventListener('click',async function(e){e.preventDefault();
      if(!(window.cowork&&window.cowork.askClaude)){cout.textContent=t('chat_off');return;}
      cbn.disabled=true;const _lbl=cbn.textContent;cbn.textContent=t('chat_wait');
      try{
        const prompt="Tu aides Nico, 'il francese del vino' a Milano (enoteca 100% francaise, petits producteurs artisanaux, ton direct et incarne, jamais pompeux, accessible). Reecris le SCRIPT de reel en ITALIEN: max ~30 s parlees, UNE seule idee, accroche forte des les 3 premieres secondes, et si pertinent une phrase a retenir + une question finale pour les commentaires. NE JAMAIS inventer un millesime, une note de degustation, un nom de producteur ou un fait. Applique la consigne de Nico. Reponds UNIQUEMENT le script reecrit, sans commentaire.";
        const r=await window.cowork.askClaude(prompt,[{script:v.script,consigne:ci.value||'Rends-le plus court et plus punchy.',etage:funnelOf(v),titre:v.fr}]);
        let txt=(typeof r==='string')?r:(r&&(r.text||r.output||r.content||(r.message&&r.message.content)||JSON.stringify(r)));
        if(txt&&typeof txt!=='string')txt=JSON.stringify(txt);
        showOut(txt||'(reponse vide)');SET('vino_v'+v.id+'_chatout',txt||'');
      }catch(err){cout.textContent='Erreur: '+(err&&err.message||err);}
      cbn.disabled=false;cbn.textContent=_lbl;
    });
    app.appendChild(card);
  });
}
function renderAll(){
  document.getElementById('pgtitle').textContent=t('title');
  document.getElementById('pgsub').textContent=t('sub');
  document.getElementById('pghint').textContent=t('hint');
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  renderMid();renderStats();renderAnalysis();renderFilters();buildApp();renderAgenda();
}
document.querySelectorAll('.langbtn').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.l;SET('vino_lang',LANG);renderAll();}));
document.getElementById('cpstatus').addEventListener('click',function(){
  const sorted=DATA.slice().sort((a,b)=>Number(a.id)-Number(b.id));
  const shot=[],ed=[],pub=[];
  sorted.forEach(v=>{
    if(LS('vino_v'+v.id+'_tourne',false))shot.push(v.id);
    if(LS('vino_v'+v.id+'_monte',false))ed.push(v.id);
    if(LS('vino_v'+v.id+'_publie',false))pub.push(v.id);
  });
  const NL=String.fromCharCode(10);
  const txt=['STATUT VIDEOS VINOTHEQUE','Tournées: '+(shot.join(', ')||'aucune'),'Montées: '+(ed.join(', ')||'aucune'),'Publiées: '+(pub.join(', ')||'aucune')].join(NL);
  navigator.clipboard.writeText(txt).then(()=>{const b=document.getElementById('cpstatus');b.textContent='✅ Copié !';setTimeout(()=>b.textContent='📋 Copier statut pour Claude',2000);});
});
renderAll();
