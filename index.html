<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB — Nico</title>
<style>
  :root{
    --bg:#111110;--surface:#1a1a19;--surface2:#212120;--line:#333330;
    --text:#fff;--mut:#c3c2b7;--mut2:#8a897f;
    --rsvp:#3987e5;--nws:#d95926;--immobilier:#199e70;--perso:#8a897f;
    --good:#31c48d;--warn:#e0a415;--crit:#e66767;--accent:#3987e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  /* LOGIN */
  #login{display:flex;align-items:center;justify-content:center;height:100vh;padding:20px}
  .loginbox{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
  .loginbox h1{margin:0 0 4px;font-size:24px}
  .loginbox p{margin:0 0 20px;color:var(--mut2);font-size:13px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px}
  .btn{width:100%;padding:12px;background:var(--accent);border:0;border-radius:10px;color:#fff;font-weight:700;font-size:14px}
  .btn.sec{background:var(--surface2);border:1px solid var(--line);color:var(--text)}
  .btn.sm{width:auto;padding:8px 14px;font-size:13px}
  .err{color:var(--crit);font-size:13px;margin-top:10px;min-height:16px}
  /* APP LAYOUT */
  #app{display:none;height:100vh}
  .layout{display:grid;grid-template-columns:220px 1fr;height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .brand{font-size:18px;font-weight:800;padding:6px 10px 14px}
  .brand small{color:var(--mut2);font-weight:600}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mut);font-size:14px;font-weight:600}
  .nav:hover{background:var(--surface2);color:var(--text)}
  .nav.active{background:var(--surface2);color:var(--text)}
  .nav .ic{width:18px;text-align:center}
  .nav .soon{margin-left:auto;font-size:9px;color:var(--mut2);font-weight:700;text-transform:uppercase}
  .side .spacer{flex:1}
  .main{overflow-y:auto;padding:22px 24px 60px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .head h2{margin:0;font-size:22px}
  .head .u{font-size:12px;color:var(--mut2)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .toolbar input[type=search]{flex:1;min-width:160px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--mut);font-size:12.5px;font-weight:600}
  .chip.on{background:var(--surface2);color:var(--text);border-color:var(--mut2)}
  /* CARDS/TABLE */
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .item:hover{border-color:var(--mut2)}
  .av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--surface2)}
  .item .b{flex:1;min-width:0}
  .item .n{font-size:14.5px;font-weight:700;line-height:1.2}
  .item .s{font-size:12px;color:var(--mut2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
  .tg{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .empty{text-align:center;color:var(--mut2);padding:50px 20px;font-size:14px}
  .muted{color:var(--mut2)}
  /* MODAL */
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center;z-index:50}
  .ov.on{display:flex}
  .modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px;max-height:92vh;overflow-y:auto}
  @media(min-width:600px){.ov{align-items:center}.modal{border-radius:18px}}
  .modal h3{margin:0 0 16px;font-size:18px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .selgrid{display:flex;flex-wrap:wrap;gap:6px}
  .selgrid button{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--mut);font-size:12.5px;font-weight:600}
  .selgrid button.on{color:#fff}
  .modal .actions{display:flex;gap:10px;margin-top:18px}
  .modal textarea{min-height:70px;resize:vertical}
  .del{color:var(--crit);background:transparent;border:0;font-size:13px;font-weight:600;margin-right:auto;padding:0}
  @media(max-width:720px){
    .layout{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:230px;transform:translateX(-100%);transition:.2s;z-index:40}
    .side.open{transform:none}
    .burger{display:inline-flex!important}
    .ovnav{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
    .ovnav.on{display:block}
  }
  .burger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 11px;font-size:16px}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login">
  <form class="loginbox" id="loginform" autocomplete="on">
    <h1>HUB</h1>
    <p>Ta tour de contrôle · RSVP · NWS · Immobilier</p>
    <div class="field"><label>Email</label><input id="lemail" name="username" type="email" autocomplete="username" placeholder="nadeau.nicolas@gmail.com"></div>
    <div class="field"><label>Mot de passe</label><input id="lpass" name="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="lbtn" type="submit">Se connecter</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="ovnav" id="ovnav" onclick="toggleNav(false)"></div>
  <div class="layout">
    <aside class="side" id="side">
      <div class="brand">HUB <small>· Nico</small></div>
      <a class="nav" data-view="cockpit"><span class="ic">◎</span> Cockpit</a>
      <a class="nav active" data-view="contacts"><span class="ic">👤</span> Contacts</a>
      <a class="nav" data-view="orgs"><span class="ic">🏢</span> Organisations</a>
      <a class="nav" data-view="pipeline"><span class="ic">📈</span> Pipeline</a>
      <a class="nav" data-view="projets"><span class="ic">🎯</span> Projets</a>
      <a class="nav" data-view="taches"><span class="ic">✅</span> Tâches</a>
      <a class="nav" data-view="finances"><span class="ic">💶</span> Finances</a>
      <a class="nav" data-view="treso"><span class="ic">💰</span> Trésorerie</a>
      <a class="nav" data-view="immobilier"><span class="ic">🏠</span> Immobilier</a>
      <a class="nav" data-view="contenu"><span class="ic">🎬</span> Contenu</a>
      <a class="nav" data-view="pilotage"><span class="ic">📊</span> Pilotage</a>
      <div class="spacer"></div>
      <a class="nav" id="logout"><span class="ic">⏻</span> Déconnexion</a>
    </aside>
    <main class="main">
      <div class="head">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="burger" onclick="toggleNav(true)">☰</button>
          <h2 id="title">Contacts</h2>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="u" id="whoami"></span>
          <button class="btn sm" id="addbtn">+ Nouveau</button>
        </div>
      </div>
      <div id="content"></div>
    </main>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div class="ov" id="ov">
  <div class="modal" id="modal"></div>
</div>

<script>
const SUPA_URL = "https://rdursbdlxaxrwafyyqwv.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdXJzYmRseGF4cndhZnl5cXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDc4NzQsImV4cCI6MjEwMDcyMzg3NH0.4wxwNnPbWsp_KVgH7GanEpKxKpg7imxyuvkDoB2UJiY";

const ROLES = ['client','prospect','fournisseur','partenaire','financeur'];
const PILIERS = [['rsvp','RSVP'],['nws','NWS'],['immobilier','Immobilier'],['perso','Perso']];
const PIL_COLOR = {rsvp:'var(--rsvp)',nws:'var(--nws)',immobilier:'var(--immobilier)',perso:'var(--perso)'};
const ROLE_LABEL = {client:'Client',prospect:'Prospect',fournisseur:'Fournisseur',partenaire:'Partenaire',financeur:'Financeur'};
const STAGES = [['nouveau','Nouveau'],['qualifie','Qualifié'],['proposition','Proposition'],['negociation','Négociation'],['gagne','Gagné'],['perdu','Perdu']];

let token=null, email=null, view='contacts';
let cacheOrgs=[], cacheContacts=[];
let filterRole=null, filterPil=null, filterSrc=null, search='';
const SRC_LABEL={'brevo:bni':'BNI','brevo:cci':'CCI','brevo:corporate':'Corporate','brevo:horeca':'Horeca','brevo:leads-meta':'Leads Meta','brevo:vino-optin':'Vinothèque','brevo:vino-whatsapp':'Vino WhatsApp','brevo:clients-btob':'Clients B2B','brevo:conversations':'Conversations','brevo:autre':'Brevo'};
const srcLabel=s=>SRC_LABEL[s]||(s?s.replace('brevo:',''):'');

/* ───── API ───── */
async function sb(path, opts={}, _retry){
  const r = await fetch(SUPA_URL+'/rest/v1/'+path, {
    ...opts,
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+(token||SUPA_KEY),
      'Content-Type':'application/json',
      'Prefer':opts.prefer||'return=representation',
      ...(opts.headers||{})
    }
  });
  if(r.status===401 && !_retry){
    try{const raw=localStorage.getItem('hub_session');
      if(raw){const f=await tryRefresh(JSON.parse(raw)); if(f){token=f; return sb(path,opts,true);}}
    }catch(e){}
  }
  if(!r.ok){ const t=await r.text(); throw new Error(t||r.status); }
  if(r.status===204) return null;
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}

/* ───── AUTH ───── */
function saveSession(d,em){
  try{
    localStorage.setItem('hub_session',JSON.stringify({
      email:em,access_token:d.access_token,refresh_token:d.refresh_token,
      expires_at:d.expires_at||(Math.floor(Date.now()/1000)+(d.expires_in||3600))
    }));
    localStorage.setItem('hub_email',em);
  }catch(e){}
}
function enterApp(access,em){
  token=access; email=em;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').textContent=em;
  boot();
}
async function login(){
  const em=document.getElementById('lemail').value.trim();
  const pw=document.getElementById('lpass').value;
  const errEl=document.getElementById('lerr'); errEl.textContent='';
  if(!em||!pw){errEl.textContent='Email et mot de passe requis.';return;}
  document.getElementById('lbtn').textContent='Connexion…';
  try{
    const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:em,password:pw})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error_description||d.msg||'Identifiants invalides');
    saveSession(d,em);
    enterApp(d.access_token,em);
  }catch(e){ errEl.textContent=e.message; }
  document.getElementById('lbtn').textContent='Se connecter';
}
async function tryRefresh(sess){
  try{
    const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:sess.refresh_token})
    });
    const d=await r.json();
    if(!r.ok) throw new Error('refresh');
    saveSession(d,sess.email); return d.access_token;
  }catch(e){ return null; }
}
document.getElementById('loginform').addEventListener('submit',e=>{e.preventDefault();login();});
document.getElementById('logout').onclick=()=>{try{localStorage.removeItem('hub_session');}catch(e){}token=null;location.reload();};

/* Restauration : email mémorisé + reste connecté */
(async function restore(){
  try{
    const em=localStorage.getItem('hub_email');
    if(em)document.getElementById('lemail').value=em;
    const raw=localStorage.getItem('hub_session'); if(!raw)return;
    const sess=JSON.parse(raw); const now=Math.floor(Date.now()/1000);
    if(sess.access_token&&sess.expires_at&&sess.expires_at>now+60){enterApp(sess.access_token,sess.email);return;}
    const fresh=await tryRefresh(sess); if(fresh)enterApp(fresh,sess.email);
  }catch(e){}
})();

/* ───── NAV ───── */
document.querySelectorAll('.nav[data-view]').forEach(n=>{
  n.onclick=()=>{
    const v=n.dataset.view; if(v==='soon')return;
    document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
    n.classList.add('active'); view=v; toggleNav(false); render();
  };
});
function toggleNav(open){
  document.getElementById('side').classList.toggle('open',open);
  document.getElementById('ovnav').classList.toggle('on',open);
}
document.getElementById('addbtn').onclick=()=>{
  if(view==='contacts')openContact();
  else if(view==='orgs')openOrg();
  else if(view==='pipeline')openOppo();
  else if(view==='projets')openProjet();
  else if(view==='taches')openTache();
  else if(view==='finances')openFin();
};

/* ───── BOOT ───── */
async function boot(){
  try{ cacheOrgs=await sb('organisations?select=*&order=nom'); }catch(e){ cacheOrgs=[]; }
  try{ cacheContacts=await sb('contacts?select=*&order=nom&limit=5000'); }catch(e){ cacheContacts=[]; }
  render();
}

/* ───── RENDER ───── */
const TITLES={cockpit:'Cockpit',contacts:'Contacts',orgs:'Organisations',pipeline:'Pipeline',projets:'Projets',taches:'Tâches',finances:'Finances',treso:'Trésorerie',immobilier:'Immobilier',contenu:'Contenu',pilotage:'Pilotage RSVP'};
const el=id=>document.getElementById(id);
function render(){
  el('title').textContent=TITLES[view]||'HUB';
  el('addbtn').style.display=['contacts','orgs','pipeline','projets','taches','finances'].includes(view)?'':'none';
  if(view==='contacts')return renderContacts();
  if(view==='orgs')return renderOrgs();
  if(view==='pipeline')return renderPipeline();
  if(view==='projets')return renderProjets();
  if(view==='taches')return renderTaches();
  if(view==='finances')return renderFinances();
  if(view==='treso')return renderTreso();
  if(view==='immobilier')return renderImmobilier();
  if(view==='contenu')return renderContenu();
  if(view==='pilotage')return renderPilotage();
  if(view==='cockpit')return renderCockpit();
}
function initials(c){return ((c.prenom||'')[0]||'')+((c.nom||'')[0]||'')||'?';}

/* CONTACTS */
async function renderContacts(){
  el('content').innerHTML='<div class="empty">Chargement…</div>';
  try{ cacheContacts=await sb('contacts?select=*&order=nom&limit=5000'); }catch(e){ el('content').innerHTML='<div class="empty">Erreur de lecture. As-tu bien appliqué les règles d\'accès (SQL) ?</div>'; return; }
  const cats=[...new Set(cacheContacts.map(c=>c.source).filter(Boolean))].sort();
  el('content').innerHTML=`
    <div class="toolbar"><input type="search" id="q" placeholder="Rechercher un contact…" value="${search}"></div>
    <div class="toolbar" id="frole"></div>
    ${cats.length?'<div class="toolbar" id="fcat"></div>':''}
    <div id="clist" class="list"></div>`;
  el('frole').innerHTML='<span class="chip '+(!filterRole?'on':'')+'" data-r="">Tous rôles</span>'+
    ROLES.map(r=>`<span class="chip ${filterRole===r?'on':''}" data-r="${r}">${ROLE_LABEL[r]}</span>`).join('')+
    '<span style="width:10px;display:inline-block"></span>'+'<span class="chip '+(!filterPil?'on':'')+'" data-p="">Tous piliers</span>'+
    PILIERS.map(([k,l])=>`<span class="chip ${filterPil===k?'on':''}" data-p="${k}">${l}</span>`).join('');
  el('frole').querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{filterRole=c.dataset.r||null;renderContacts();});
  el('frole').querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{filterPil=c.dataset.p||null;renderContacts();});
  if(cats.length){
    el('fcat').innerHTML='<span class="chip '+(!filterSrc?'on':'')+'" data-c="">Toutes catégories</span>'+
      cats.map(s=>`<span class="chip ${filterSrc===s?'on':''}" data-c="${s}">${srcLabel(s)}</span>`).join('');
    el('fcat').querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>{filterSrc=c.dataset.c||null;renderContacts();});
  }
  el('q').oninput=e=>{search=e.target.value;drawContacts();};
  drawContacts();
}
function drawContacts(){
  let rows=cacheContacts.slice();
  if(filterRole)rows=rows.filter(c=>(c.roles||[]).includes(filterRole));
  if(filterPil)rows=rows.filter(c=>(c.piliers||[]).includes(filterPil));
  if(filterSrc)rows=rows.filter(c=>c.source===filterSrc);
  if(search){const s=search.toLowerCase();rows=rows.filter(c=>((c.prenom||'')+' '+(c.nom||'')+' '+(c.email||'')+' '+(c.telephone||'')).toLowerCase().includes(s));}
  const orgName=id=>{const o=cacheOrgs.find(o=>o.id===id);return o?o.nom:'';};
  if(!rows.length){el('clist').innerHTML='<div class="empty">Aucun contact.</div>';return;}
  const shown=rows.slice(0,300);
  const head=`<div class="muted" style="font-size:12px;margin-bottom:8px">${rows.length} contact${rows.length>1?'s':''}${rows.length>300?" · 300 affichés (affine avec la recherche/filtres)":''}</div>`;
  el('clist').innerHTML=head+shown.map(c=>`
    <div class="item" onclick='openContact(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <div class="av">${initials(c)}</div>
      <div class="b">
        <div class="n">${(c.prenom||'')+' '+c.nom}</div>
        <div class="s">${[orgName(c.organisation_id),c.poste,c.email,c.telephone].filter(Boolean).join(' · ')||'—'}</div>
      </div>
      <div class="tags">
        ${c.source&&srcLabel(c.source)?`<span class="tg" style="background:#3987e522;color:var(--rsvp)">${srcLabel(c.source)}</span>`:''}
        ${(c.piliers||[]).map(p=>`<span class="tg" style="background:${PIL_COLOR[p]}22;color:${PIL_COLOR[p]}">${p}</span>`).join('')}
        ${(c.roles||[]).map(r=>`<span class="tg" style="background:#8a897f22;color:var(--mut)">${ROLE_LABEL[r]}</span>`).join('')}
      </div>
    </div>`).join('');
}

/* MODAL helpers */
function openModal(html){el('modal').innerHTML=html;el('ov').classList.add('on');}
function closeModal(){el('ov').classList.remove('on');}
el('ov').onclick=e=>{if(e.target===el('ov'))closeModal();};

function multiSel(id,options,selected){
  return `<div class="selgrid" id="${id}">`+options.map(([k,l])=>
    `<button type="button" data-v="${k}" class="${selected.includes(k)?'on':''}" style="${selected.includes(k)&&PIL_COLOR[k]?'background:'+PIL_COLOR[k]:''}">${l}</button>`).join('')+`</div>`;
}
function wireMulti(id){el(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{
  b.classList.toggle('on');
  const v=b.dataset.v; if(PIL_COLOR[v])b.style.background=b.classList.contains('on')?PIL_COLOR[v]:'';
});}
function getMulti(id){return [...el(id).querySelectorAll('button.on')].map(b=>b.dataset.v);}

/* CONTACT FORM */
function openContact(c){
  c=c||{};const isEdit=!!c.id;
  const orgOpts='<option value="">— aucune —</option>'+cacheOrgs.map(o=>`<option value="${o.id}" ${c.organisation_id===o.id?'selected':''}>${o.nom}</option>`).join('');
  openModal(`
    <h3>${isEdit?'Modifier le contact':'Nouveau contact'}</h3>
    <div class="row2">
      <div class="field"><label>Prénom</label><input id="f_prenom" value="${c.prenom||''}"></div>
      <div class="field"><label>Nom *</label><input id="f_nom" value="${c.nom||''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Email</label><input id="f_email" value="${c.email||''}"></div>
      <div class="field"><label>Téléphone</label><input id="f_tel" value="${c.telephone||''}"></div>
    </div>
    <div class="field"><label>Organisation</label><select id="f_org">${orgOpts}</select></div>
    <div class="field"><label>Poste</label><input id="f_poste" value="${c.poste||''}"></div>
    <div class="field"><label>Rôles</label>${multiSel('f_roles',ROLES.map(r=>[r,ROLE_LABEL[r]]),c.roles||[])}</div>

async function sendEmail(to,name,contactId){
  const subject=el('e_subj').value.trim(), text=el('e_body').value.trim();
  if(!subject||!text){el('e_err').textContent='Objet et message requis.';return;}
  el('e_send').textContent='Envoi…';el('e_send').disabled=true;
  try{
    const r=await fetch(SUPA_URL+'/functions/v1/send-email',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({to,toName:name,subject,text})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    if(contactId){try{await sb('interactions',{method:'POST',prefer:'return=minimal',body:JSON.stringify({type:'email',sujet:subject,contenu:text,contact_id:contactId,source:'hub'})});}catch(e){}}
    el('modal').innerHTML='<h3>✅ Email envoyé</h3><p class="muted">À '+(name||to)+' — enregistré dans l’historique du contact.</p><div class="actions"><button class="btn sm" onclick="closeModal()">Fermer</button></div>';
  }catch(e){el('e_err').textContent='Erreur : '+e.message;el('e_send').textContent='Réessayer';el('e_send').disabled=false;}
}

  el('tf').querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{tPil=c.dataset.p||null;renderTaches();});

  if(tPil)ts=ts.filter(t=>t.pilier===tPil);

            <span class="tg" style="background:${PRIO_COLOR[t.priorite]}22;color:${PRIO_COLOR[t.priorite]}">${(t.priorite||'p4').toUpperCase()}</span>

async function delTache(id){if(!confirm('Supprimer ?'))return;try{await sb('taches?id=eq.'+id,{method:'DELETE',prefer:'return=minimal'});closeModal();renderTaches();}catch(e){alert(e.message);}}

/* FINANCES */
const F_STAT=[['prevu','Prévu'],['a_regler','À régler'],['regle','Réglé'],['en_retard','En retard']];
async function renderFinances(){
  el('content').innerHTML='<div id="flist" class="list"><div class="empty">Chargement…</div></div>';
  let fs;try{fs=await sb('finances?select=*&order=date_echeance.asc.nullslast');}catch(e){el('flist').innerHTML='<div class="empty">Erreur de lecture.</div>';return;}
  if(!fs.length){el('flist').innerHTML='<div class="empty">Aucune ligne. Clique « + Nouveau ».</div>';return;}
  const today=new Date();today.setHours(0,0,0,0);
  const totOut=fs.filter(f=>f.sens==='sortie'&&f.statut!=='regle').reduce((s,f)=>s+(+f.montant||0),0);
  el('flist').innerHTML=`<div class="item"><div class="b"><div class="s">Total à régler (sorties non réglées)</div><div class="n" style="font-size:20px;color:var(--crit)">−${Math.round(totOut).toLocaleString('fr-FR')} €</div></div></div>`+fs.map(f=>{
    const out=f.sens==='sortie';const col=out?'var(--crit)':'var(--good)';
    let due='';if(f.date_echeance&&f.statut!=='regle'){const d=new Date(f.date_echeance);const late=d<today;due=`<span class="tg" style="background:${late?'#e6676722':'#8a897f22'};color:${late?'var(--crit)':'var(--mut)'}">${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</span>`;}
    return `<div class="item" onclick='openFin(${JSON.stringify(f).replace(/'/g,"&#39;")})'>
      <div class="av" style="background:${col}22;color:${col}">${out?'↓':'↑'}</div>
      <div class="b"><div class="n">${f.libelle}</div><div class="s">${[f.type,f.pilier,f.statut].filter(Boolean).join(' · ')}</div></div>
      <div class="tags">${due}<span class="tg" style="background:${col}22;color:${col}">${out?'−':'+'}${Math.round(f.montant).toLocaleString('fr-FR')} €</span></div>
    </div>`;
  }).join('');
}
function openFin(f){
  f=f||{};const isEdit=!!f.id;
  const types=[['echeance','Échéance'],['transaction','Transaction'],['dette','Dette']];
  openModal(`
    <h3>${isEdit?'Modifier':'Nouvelle ligne financière'}</h3>
    <div class="field"><label>Libellé *</label><input id="x_lib" value="${(f.libelle||'').replace(/"/g,'&quot;')}"></div>
    <div class="row2">
      <div class="field"><label>Montant (€) *</label><input id="x_mt" type="number" value="${f.montant||''}"></div>
      <div class="field"><label>Sens</label><select id="x_sens"><option value="sortie" ${f.sens!=='entree'?'selected':''}>Sortie</option><option value="entree" ${f.sens==='entree'?'selected':''}>Entrée</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Type</label><select id="x_type">${types.map(([k,l])=>`<option value="${k}" ${f.type===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Statut</label><select id="x_stat">${F_STAT.map(([k,l])=>`<option value="${k}" ${f.statut===k?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Pilier</label><select id="x_pil"><option value="">—</option>${PILIERS.map(([k,l])=>`<option value="${k}" ${f.pilier===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Échéance</label><input id="x_ech" type="date" value="${f.date_echeance||''}"></div>
    </div>
    <div class="actions">
      ${isEdit?`<button class="del" onclick='delFin("${f.id}")'>Supprimer</button>`:''}
      <button class="btn sec sm" onclick="closeModal()">Annuler</button>
      <button class="btn sm" id="xsave">${isEdit?'Enregistrer':'Créer'}</button>
    </div><div class="err" id="xerr"></div>`);
  el('xsave').onclick=()=>saveFin(f.id);
}
async function saveFin(id){
  const body={libelle:el('x_lib').value.trim(),montant:el('x_mt').value?+el('x_mt').value:null,sens:el('x_sens').value,
    type:el('x_type').value,statut:el('x_stat').value,pilier:el('x_pil').value||null,date_echeance:el('x_ech').value||null};
  if(!body.libelle||body.montant==null){el('xerr').textContent='Libellé et montant requis.';return;}
  try{if(id)await sb('finances?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});else await sb('finances',{method:'POST',body:JSON.stringify(body)});closeModal();renderFinances();}
  catch(e){el('xerr').textContent='Erreur : '+e.message;}
}
async function delFin(id){if(!confirm('Supprimer ?'))return;try{await sb('finances?id=eq.'+id,{method:'DELETE',prefer:'return=minimal'});closeModal();renderFinances();}catch(e){alert(e.message);}}

/* TRÉSORERIE */
const eurl=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('fr-FR')+' €';
async function renderTreso(){
  el('content').innerHTML=`<iframe src="./treso.html" title="Trésorerie" style="width:100%;height:calc(100vh - 120px);border:1px solid var(--line);border-radius:14px;background:#0f1420"></iframe>`;
  return;
  let t={},fs=[];
  try{const r=await sb('treso_snapshot?id=eq.1&select=*');t=(r&&r[0])||{};}catch(e){}
  try{fs=await sb('finances?select=*&order=date_echeance.asc.nullslast');}catch(e){}
  const solde=+t.solde_ca||0,aidexa=+t.aidexa||0,limite=+t.limite||-25000;
  const marge=Math.abs(limite)-Math.abs(solde);
  const pct=Math.min(100,Math.abs(solde)/Math.abs(limite||-25000)*100);
  const barcol=pct>90?'var(--crit)':pct>75?'var(--warn)':'var(--good)';
  const today=new Date();today.setHours(0,0,0,0);const in30=new Date(today);in30.setDate(in30.getDate()+30);
  const dueAll=fs.filter(f=>f.sens==='sortie'&&f.statut!=='regle');
  const due30=dueAll.filter(f=>f.date_echeance&&new Date(f.date_echeance)<=in30).reduce((s,f)=>s+(+f.montant||0),0);
  const totDette=fs.filter(f=>f.type==='dette'&&f.statut!=='regle').reduce((s,f)=>s+(+f.montant||0),0);
  el('content').innerHTML=`
    <div class="grid" style="grid-template-columns:1.4fr 1fr 1fr;gap:12px">
      <div class="card">
        <div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);font-weight:700">Solde compte courant</div>
        <div style="font-size:30px;font-weight:800;color:${solde<0?'var(--crit)':'var(--good)'};margin-top:6px">${eurl(solde)}</div>
        <div style="height:10px;border-radius:6px;background:var(--surface2);margin-top:14px;position:relative;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:${barcol};width:${pct}%;display:block"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut2);margin-top:6px"><span>0 €</span><span>marge ${eurl(marge)}</span><span>limite ${eurl(limite)}</span></div>
      </div>
      <div class="card"><div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);font-weight:700">Réserve Aidexa</div><div style="font-size:26px;font-weight:800;color:var(--good);margin-top:6px">${eurl(aidexa)}</div><div style="font-size:12px;color:var(--mut);margin-top:6px">Bouée mobilisable</div></div>
      <div class="card"><div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);font-weight:700">À sortir sous 30 j</div><div style="font-size:26px;font-weight:800;color:var(--warn);margin-top:6px">${eurl(-Math.abs(due30))}</div><div style="font-size:12px;color:var(--mut);margin-top:6px">Dettes : ${eurl(-Math.abs(totDette))}</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin:16px 0 6px;flex-wrap:wrap"><button class="btn sm" id="tresoedit" style="width:auto">Mettre à jour le solde</button><span class="muted" style="font-size:12px">${t.note||''}</span></div>
    <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);margin:20px 0 10px">🧾 Échéances &amp; dettes à régler</h2>
    <div class="list">${dueAll.map(f=>{const late=f.date_echeance&&new Date(f.date_echeance)<today;return `<div class="item"><div class="b"><div class="n">${f.libelle}</div><div class="s">${[f.type,f.pilier,(f.date_echeance?new Date(f.date_echeance).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):'sans date')].filter(Boolean).join(' · ')}</div></div><div class="tags"><span class="tg" style="background:${late?'#e6676722':'#8a897f22'};color:${late?'var(--crit)':'var(--mut)'}">${eurl(-Math.abs(f.montant))}</span></div></div>`;}).join('')||'<div class="empty">Rien à régler 🎉</div>'}</div>`;
  el('tresoedit').onclick=()=>openTresoEdit(t);
}
function openTresoEdit(t){
  t=t||{};
  openModal(`<h3>Mettre à jour la trésorerie</h3>
    <div class="field"><label>Solde compte courant (€)</label><input id="ts_solde" type="number" value="${t.solde_ca||''}"></div>
    <div class="field"><label>Réserve Aidexa (€)</label><input id="ts_aid" type="number" value="${t.aidexa||''}"></div>
    <div class="field"><label>Limite découvert (€)</label><input id="ts_lim" type="number" value="${t.limite||-25000}"></div>
    <div class="field"><label>Note</label><input id="ts_note" value="${(t.note||'').replace(/"/g,'&quot;')}"></div>
    <div class="actions"><button class="btn sec sm" onclick="closeModal()">Annuler</button><button class="btn sm" id="tssave">Enregistrer</button></div><div class="err" id="tserr"></div>`);
  el('tssave').onclick=saveTreso;
}
async function saveTreso(){
  const body={solde_ca:el('ts_solde').value?+el('ts_solde').value:null,aidexa:el('ts_aid').value?+el('ts_aid').value:null,limite:el('ts_lim').value?+el('ts_lim').value:-25000,note:el('ts_note').value.trim()||null,updated_at:new Date().toISOString()};
  try{await sb('treso_snapshot?id=eq.1',{method:'PATCH',body:JSON.stringify(body)});closeModal();renderTreso();}
  catch(e){el('tserr').textContent='Erreur : '+e.message;}
}

/* ARTIFACTS INTÉGRÉS */
let immoSub='isa';
function frame(src){return `<iframe src="./${src}" style="width:100%;height:calc(100vh - 160px);border:1px solid var(--line);border-radius:14px;background:#0f1420"></iframe>`;}
function renderImmobilier(){
  el('content').innerHTML=`<div class="toolbar">
    <span class="chip ${immoSub==='isa'?'on':''}" id="im_isa">Simulateur ISA</span>
    <span class="chip ${immoSub==='edolo'?'on':''}" id="im_edolo">Rénovation Edolo</span>
  </div>`+frame(immoSub==='isa'?'immobilier-isa.html':'edolo.html');
  el('im_isa').onclick=()=>{immoSub='isa';renderImmobilier();};
  el('im_edolo').onclick=()=>{immoSub='edolo';renderImmobilier();};
}
function renderContenu(){el('content').innerHTML=frame('vinotheque.html');}
function renderPilotage(){el('content').innerHTML=frame('pilotage.html');}

/* COCKPIT */
async function renderCockpit(){
  el('content').innerHTML='<div class="empty">Chargement…</div>';
  let ts=[],fs=[],nc=0;
  try{ts=await sb('taches?select=*');}catch(e){}
  try{fs=await sb('finances?select=*');}catch(e){}
  try{nc=(await sb('contacts?select=id&limit=5000')).length;}catch(e){}
  let ag=[];try{ag=(await sb('agenda_cache?select=*&order=debut.asc')).filter(e=>new Date(e.debut)>=new Date(Date.now()-43200000));}catch(e){}
  const today=new Date();today.setHours(0,0,0,0);
  const in30=new Date(today);in30.setDate(in30.getDate()+30);
  const open=ts.filter(t=>t.statut==='a_faire'||t.statut==='en_cours');
  const late=open.filter(t=>t.echeance&&new Date(t.echeance)<today);
  const p1=open.filter(t=>t.priorite==='p1');
  const due=fs.filter(f=>f.sens==='sortie'&&f.statut!=='regle'&&f.date_echeance&&new Date(f.date_echeance)<=in30)
    .sort((a,b)=>new Date(a.date_echeance)-new Date(b.date_echeance));
  const due30=due.reduce((s,f)=>s+(+f.montant||0),0);
  const kpi=(lab,val,col)=>`<div class="item"><div class="b"><div class="s">${lab}</div><div class="n" style="font-size:22px;${col?'color:'+col:''}">${val}</div></div></div>`;
  el('content').innerHTML=`
    <div class="list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      ${kpi('À sortir sous 30 j',Math.round(due30).toLocaleString('fr-FR')+' €','var(--warn)')}
      ${kpi('Tâches en retard',late.length,late.length?'var(--crit)':'var(--good)')}
      ${kpi('P1 ouvertes',p1.length,'var(--warn)')}
      ${kpi('Contacts',nc,'')}
    </div>
    <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);margin:24px 0 10px">📅 Agenda — prochains jours</h2>
    <div class="list">${ag.slice(0,8).map(e=>`<div class="item"><div class="av">📅</div><div class="b"><div class="n">${e.titre}</div><div class="s">${new Date(e.debut).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'})} · ${new Date(e.debut).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}${e.lieu?' · '+e.lieu:''}</div></div></div>`).join('')||'<div class="empty">Rien à l’agenda</div>'}</div>
    <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);margin:24px 0 10px">🔥 P1 en cours</h2>
    <div class="list">${p1.slice(0,6).map(t=>`<div class="item"><div class="av" style="background:#e6676722;color:var(--crit)">!</div><div class="b"><div class="n">${t.titre}</div><div class="s">${t.pilier||''}</div></div></div>`).join('')||'<div class="empty">Rien en P1 🎉</div>'}</div>
    <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);margin:24px 0 10px">🧾 Prochaines sorties (30 j)</h2>
    <div class="list">${due.slice(0,6).map(f=>`<div class="item"><div class="b"><div class="n">${f.libelle}</div><div class="s">${new Date(f.date_echeance).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})} · ${f.pilier||''}</div></div><div class="tags"><span class="tg" style="background:#e6676722;color:var(--crit)">−${Math.round(f.montant).toLocaleString('fr-FR')} €</span></div></div>`).join('')||'<div class="empty">Aucune échéance à 30 j</div>'}</div>`;
}
</script>
