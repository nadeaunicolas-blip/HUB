/* ───── API ───── */
async function sb(path, opts={}, _retry){
  const r = await fetch(SUPA_URL+'/rest/v1/'+path, {
    ...opts,
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+(token||SUPA_KEY),
      'Content-Type':'application/json',
      'Prefer':opts.prefer||'return=representation',
      ...(opts.headers||{})
    }
  });
  if(r.status===401 && !_retry){
    try{const raw=localStorage.getItem('hub_session');
      if(raw){const f=await tryRefresh(JSON.parse(raw)); if(f){token=f; return sb(path,opts,true);}}
    }catch(e){}
  }
  if(!r.ok){ const t=await r.text(); throw new Error(t||r.status); }
  if(r.status===204) return null;
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}
/* charge TOUTES les lignes malgré le plafond 1000 de PostgREST (pagination par offset) */
async function sbAll(path){
  var all=[],off=0,step=1000;
  for(var i=0;i<60;i++){
    var sep=path.indexOf('?')>=0?'&':'?';
    var page=await sb(path+sep+'limit='+step+'&offset='+off);
    if(!page||!page.length)break;
    all=all.concat(page);
    if(page.length<step)break;
    off+=step;
  }
  return all;
}

/* ───── AUTH ───── */
function saveSession(d,em){
  try{
    localStorage.setItem('hub_session',JSON.stringify({
      email:em,access_token:d.access_token,refresh_token:d.refresh_token,
      expires_at:d.expires_at||(Math.floor(Date.now()/1000)+(d.expires_in||3600))
    }));
    localStorage.setItem('hub_email',em);
  }catch(e){}
}
function enterApp(access,em){
  token=access; email=em;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').textContent=em;
  boot();
}
async function login(){
  const em=document.getElementById('lemail').value.trim();
  const pw=document.getElementById('lpass').value;
  const errEl=document.getElementById('lerr'); errEl.textContent='';
  if(!em||!pw){errEl.textContent='Email et mot de passe requis.';return;}
  document.getElementById('lbtn').textContent='Connexion…';
  try{
    const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:em,password:pw})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error_description||d.msg||'Identifiants invalides');
    saveSession(d,em);
    enterApp(d.access_token,em);
  }catch(e){ errEl.textContent=e.message; }
  document.getElementById('lbtn').textContent='Se connecter';
}
async function tryRefresh(sess){
  try{
    const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:sess.refresh_token})
    });
    const d=await r.json();
    if(!r.ok) throw new Error('refresh');
    saveSession(d,sess.email); return d.access_token;
  }catch(e){ return null; }
}
document.getElementById('loginform').addEventListener('submit',e=>{e.preventDefault();login();});
document.getElementById('logout').onclick=()=>{try{localStorage.removeItem('hub_session');}catch(e){}token=null;location.reload();};

/* Restauration : email mémorisé + reste connecté */
(async function restore(){
  try{
    const em=localStorage.getItem('hub_email');
    if(em)document.getElementById('lemail').value=em;
    const raw=localStorage.getItem('hub_session'); if(!raw)return;
    const sess=JSON.parse(raw); const now=Math.floor(Date.now()/1000);
    if(sess.access_token&&sess.expires_at&&sess.expires_at>now+60){enterApp(sess.access_token,sess.email);return;}
    const fresh=await tryRefresh(sess); if(fresh)enterApp(fresh,sess.email);
  }catch(e){}
})();

  document.querySelectorAll('.navgroup').forEach(function(x){x.classList.remove('open');});
  if(!wasOpen)g.classList.add('open');
}
function openGroupOf(elm){if(!elm)return;var g=elm.closest('.navgroup');if(!g)return;
  document.querySelectorAll('.navgroup').forEach(function(x){x.classList.remove('open');});
  g.classList.add('open');
}

    '<span style="width:10px;display:inline-block"></span>'+'<span class="chip '+(!filterPil?'on':'')+'" data-p="">Tous piliers</span>'+
    PILIERS.map(([k,l])=>`<span class="chip ${filterPil===k?'on':''}" data-p="${k}">${l}</span>`).join('');
  el('frole').querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{filterRole=c.dataset.r||null;renderContacts();});
  el('frole').querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{filterPil=c.dataset.p||null;renderContacts();});
  if(cats.length){

    el('fcat').querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>{filterSrc=c.dataset.c||null;renderContacts();});
  }

function currentRows(){
  let rows=cacheContacts.slice();
  if(filterRole)rows=rows.filter(c=>(c.roles||[]).includes(filterRole));
  if(filterPil)rows=rows.filter(c=>(c.piliers||[]).includes(filterPil));
  if(filterSrc)rows=rows.filter(c=>(c.listes||[]).includes(filterSrc));
  if(filterReach){rows=rows.filter(c=>{var e=!!(c.email&&c.email.trim()),t=!!(c.telephone&&c.telephone.trim());
    return filterReach==='both'?(e&&t):filterReach==='email'?(e&&!t):filterReach==='tel'?(t&&!e):filterReach==='none'?(!e&&!t):true;});}
  if(filterWa)rows=rows.filter(c=>waStatus(c)===filterWa);
  if(search){const s=search.toLowerCase();rows=rows.filter(c=>((c.prenom||'')+' '+(c.nom||'')+' '+(c.email||'')+' '+(c.telephone||'')).toLowerCase().includes(s));}
  return rows;
}
function exportContacts(){
  var rows=currentRows();
  if(!rows.length){alert('Aucun contact à exporter avec ces filtres.');return;}
  var esc=function(v){v=(v==null?'':String(v));return '"'+v.replace(/"/g,'""')+'"';};
  var head=['Prénom','Nom','Téléphone','Email','Listes','Rôles','Statut WhatsApp'];
  var lines=[head.map(esc).join(',')];
  rows.forEach(function(c){lines.push([c.prenom,c.nom,c.telephone,c.email,(c.listes||[]).join(' | '),(c.roles||[]).join(' | '),WA_LABEL[waStatus(c)]||''].map(esc).join(','));});
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='contacts_'+rows.length+'.csv';document.body.appendChild(a);a.click();a.remove();
}
function copyNumbers(){
  var rows=currentRows().filter(c=>c.telephone&&c.telephone.trim());
  if(!rows.length){alert('Aucun numéro dans ce segment.');return;}
  var nums=rows.map(c=>c.telephone.trim()).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(nums).then(function(){alert(rows.length+' numéros copiés dans le presse-papier.');},function(){prompt('Copie auto impossible — sélectionne et copie :',nums);});}
  else{prompt('Copie ces numéros :',nums);}
}

  if(!rows.length){el('clist').innerHTML='<div class="empty">Aucun contact.</div>';return;}

      <div class="av">${initials(c)}</div>

          if(e)return '<span class="tg" style="background:#3987e522;color:var(--rsvp)">email</span>';
          if(t)return '<span class="tg" style="background:#d9592622;color:var(--nws)">tél seul</span>';
          return '';})()}
        ${(function(){var s=waStatus(c);if(!s)return '';var col=s==='optin'?'var(--good)':s==='contacte'?'var(--warn)':'var(--mut2)';return '<span class="tg" style="background:'+col+'22;color:'+col+'">WA: '+WA_LABEL[s]+'</span>';})()}
        ${(c.listes||[]).slice(0,2).map(l=>`<span class="tg" style="background:#8a897f22;color:var(--mut)">${l}</span>`).join('')}
        ${(c.piliers||[]).map(p=>`<span class="tg" style="background:${PIL_COLOR[p]}22;color:${PIL_COLOR[p]}">${p}</span>`).join('')}
        ${(c.roles||[]).map(r=>`<span class="tg" style="background:#8a897f22;color:var(--mut)">${ROLE_LABEL[r]}</span>`).join('')}

function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}
async function sendEmail(to,name,contactId){
  const subject=el('e_subj').value.trim(), text=el('e_body').value.trim();
  if(!subject||!text){el('e_err').textContent='Objet et message requis.';return;}
  el('e_send').textContent='Envoi…';el('e_send').disabled=true;
  try{
    let attachment=null;const fi=el('e_file');
    if(fi&&fi.files&&fi.files[0]){
      const f=fi.files[0];
      if(f.size>9*1024*1024)throw new Error('Fichier trop lourd (max ~9 Mo).');
      attachment=[{content:await fileToB64(f),name:f.name}];
    }
    const chan=(el('e_chan')&&el('e_chan').value)||'gmail';
    const fn=chan==='gmail'?'send-gmail':'send-email';
    const body={to,toName:name,subject,text};if(attachment)body.attachment=attachment;
    const r=await fetch(SUPA_URL+'/functions/v1/'+fn,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    if(contactId){try{await sb('interactions',{method:'POST',prefer:'return=minimal',body:JSON.stringify({type:'email',sujet:subject,contenu:text+(attachment?'\n[PJ: '+attachment[0].name+']':''),contact_id:contactId,source:(chan==='gmail'?'gmail':'hub'),sens:'out'})});}catch(e){}}
    el('modal').innerHTML='<h3>✅ Email envoyé</h3><p class="muted">À '+(name||to)+' — enregistré dans l’historique du contact.</p><div class="actions"><button class="btn sm" onclick="closeModal()">Fermer</button></div>';
  }catch(e){el('e_err').textContent='Erreur : '+e.message;el('e_send').textContent='Réessayer';el('e_send').disabled=false;}
}

/* EMAILING GROUPÉ */
function fillVars(s,c){
  return (s||'').replace(/{prenom}/g,(c.prenom||'').trim()).replace(/{nom}/g,(c.nom||'').trim())
    .replace(/ +([,.!?;:])/g,'$1').replace(/[ \t]{2,}/g,' ');
}
function emailingRecipients(){
  var role=el('em_role')?el('em_role').value:'';
  var liste=el('em_src')?el('em_src').value:'';
  return cacheContacts.filter(function(c){
    if(!c.email||!c.email.trim())return false;
    if(role&&!(c.roles||[]).includes(role))return false;
    if(liste&&!(c.listes||[]).includes(liste))return false;
    return true;
  });
}
function emPreview(){
  var r=emailingRecipients()[0];
  if(!r){el('em_prev').innerHTML='<span class="muted">Aucun destinataire avec email dans ce segment.</span>';return;}
  var fill=function(s){return fillVars(s,r);};
  el('em_prev').innerHTML='<div style="font-size:12px;color:var(--mut2)">Aperçu pour '+((r.prenom||'')+' '+(r.nom||'')).trim()+' &lt;'+r.email+'&gt;</div>'+
    '<div style="margin-top:8px;font-weight:700">'+(fill(el('em_subj').value)||'<span class="muted">(objet)</span>')+'</div>'+
    '<div style="margin-top:6px;white-space:pre-wrap;color:var(--mut)">'+(fill(el('em_body').value)||'<span class="muted">(message)</span>')+'</div>'+
    '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--mut2)">+ signature RSVP automatique</div>';
}
function emUpdateCount(){
  var n=emailingRecipients().length;
  el('em_count').textContent=n;
  var b=el('em_sendbtn');b.textContent='Envoyer à '+n+' contact'+(n>1?'s':'');b.disabled=(n===0);

}

   '</div>';
  ['em_role','em_src'].forEach(function(id){el(id).onchange=emUpdateCount;});
  ['em_subj','em_body'].forEach(function(id){el(id).oninput=emPreview;});
  el('em_sendbtn').onclick=emSend;

async function emSend(){
  var recips=emailingRecipients();
  var subject=el('em_subj').value.trim(), body=el('em_body').value.trim();
  if(!subject||!body){el('em_progress').innerHTML='<span style="color:var(--crit)">Objet et message requis.</span>';return;}
  if(!confirm('Envoyer à '+recips.length+' contact(s) ? Ce sont de vrais emails.'))return;
  el('em_sendbtn').disabled=true;el('em_role').disabled=el('em_src').disabled=true;
  var N=recips.length,ok=0,fail=0;
  el('em_progress').innerHTML='<div style="background:var(--surface2);border-radius:8px;height:10px;overflow:hidden;margin-bottom:8px"><div id="em_barfill" style="height:100%;width:0;background:var(--good);transition:width .2s"></div></div><div id="em_barlbl" class="muted" style="font-size:13px"></div>';
  for(var i=0;i<N;i++){
    var c=recips[i];
    var subj=fillVars(subject,c);
    var text=fillVars(body,c);
    try{
      var r=await fetch(SUPA_URL+'/functions/v1/send-email',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({to:c.email,toName:((c.prenom||'')+' '+(c.nom||'')).trim(),subject:subj,text:text})});
      var d=await r.json().catch(function(){return {};});
      if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
      ok++;
      try{await sb('interactions',{method:'POST',prefer:'return=minimal',body:JSON.stringify({type:'email',sujet:subj,contenu:text,contact_id:c.id,source:'hub-groupe'})});}catch(e){}
    }catch(e){fail++;}
    var pct=Math.round((i+1)/N*100);
    if(el('em_barfill'))el('em_barfill').style.width=pct+'%';
    if(el('em_barlbl'))el('em_barlbl').textContent=(i+1)+' / '+N+' · '+ok+' envoyés'+(fail?' · '+fail+' échecs':'');
    await new Promise(function(res){setTimeout(res,350);});
  }
  el('em_progress').innerHTML='<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px"><div style="font-weight:700">✅ Terminé</div><div class="muted" style="font-size:13px;margin-top:4px">'+ok+' email(s) envoyé(s)'+(fail?', '+fail+' échec(s) — souvent la limite 300/jour Brevo, réessaie demain pour le reste':'')+'. Tout est archivé dans l’historique des contacts.</div></div>';
  el('em_sendbtn').disabled=false;el('em_role').disabled=el('em_src').disabled=false;
}

  el('content').innerHTML='<div class="empty">Chargement…</div>';
  let agX=[],tkX=[],ca={realise:0,objectif:473000,maj:''};
  try{agX=(await sb('agenda_cache?select=*&order=debut.asc')).filter(function(e){return new Date(e.debut)>=new Date(Date.now()-43200000);});}catch(e){}

  const today=new Date();today.setHours(0,0,0,0);
  const open=tkX.filter(function(t){return t.statut==='a_faire'||t.statut==='en_cours';});
  const late=open.filter(function(t){return t.echeance&&new Date(t.echeance)<today;}).length;
  const realise=+ca.realise||0, objectif=+ca.objectif||473000;
  const pct=Math.max(0,Math.min(100, objectif?realise/objectif*100:0));
  const reste=Math.max(0,objectif-realise);
  const yEnd=new Date(today.getFullYear(),11,31); const daysLeft=Math.max(1,Math.round((yEnd-today)/86400000));
  const perMonth=reste/(daysLeft/30.44);
  const R=54,C=2*Math.PI*R, off=C*(1-pct/100);
  const agHtml=agX.slice(0,6).map(function(e){return '<div class="item"><div class="av">📅</div><div class="b"><div class="n">'+e.titre+'</div><div class="s">'+new Date(e.debut).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'})+' · '+new Date(e.debut).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+(e.lieu?' · '+e.lieu:'')+'</div></div></div>';}).join('')||'<div class="empty">Rien à l’agenda</div>';
  function uni(col,ic,titre,sous){return '<div style="cursor:pointer;position:relative;border-radius:16px;padding:22px;background:rgba(26,26,25,.5);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.14);border-top:3px solid '+col+';transition:transform .12s,background .12s" onmouseover="this.style.transform=\'translateY(-4px)\';this.style.background=\'rgba(26,26,25,.72)\'" onmouseout="this.style.transform=\'\';this.style.background=\'rgba(26,26,25,.5)\'"><div style="font-size:32px">'+ic+'</div><div style="font-size:20px;font-weight:800;margin-top:8px">'+titre+'</div><div style="color:var(--mut);font-size:12.5px;margin-top:5px;line-height:1.4">'+sous+'</div><div style="color:'+col+';font-size:12px;font-weight:700;margin-top:14px">Ouvrir →</div></div>';}
  el('content').innerHTML=
    '<div style="position:relative;border-radius:20px;overflow:hidden;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:space-between;background:#000">'+
      '<img src="./hero.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62">'+
      '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,16,.12),rgba(17,17,16,.34) 52%,rgba(17,17,16,.9))"></div>'+
      '<div style="position:relative;padding:32px 32px 0">'+
        '<div style="font-size:31px;font-weight:800">Bonjour Nico 👋</div>'+
        '<div style="color:var(--mut);font-size:13px;margin-top:6px">'+today.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+open.length+' tâches ouvertes'+(late?' · <span style="color:var(--crit)">'+late+' en retard</span>':'')+'</div>'+
      '</div>'+
      '<div style="position:relative;padding:24px 24px 32px" onclick="event.stopPropagation()">'+
        '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#e7e6dd;font-weight:700;margin:0 6px 14px">Tes univers</div>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px">'+
          '<a onclick="nav(\'rsvp\')">'+uni('var(--rsvp)','🍷','RSVP','CRM & Ventes · Opérations · Finances · Marketing')+'</a>'+
          '<a onclick="nav(\'nws\')">'+uni('var(--nws)','🍇','NWS','Import & négoce — à venir')+'</a>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:20px">'+
      '<div style="flex:2 1 320px">'+
        '<h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);font-weight:700;margin:0 0 10px">📅 Agenda — prochains jours</h2>'+
        '<div class="list">'+agHtml+'</div>'+
      '</div>'+
      '<div style="flex:1 1 260px">'+
        '<h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);font-weight:700;margin:0 0 10px">🎯 Objectif CA 2026</h2>'+
        '<div style="background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center">'+
          '<svg viewBox="0 0 140 140" style="width:168px;height:168px">'+
            '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--surface2)" stroke-width="13"></circle>'+
            '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--good)" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 70 70)"></circle>'+
            '<text x="70" y="66" text-anchor="middle" fill="#fff" style="font-size:27px;font-weight:800">'+pct.toFixed(0)+'%</text>'+
            '<text x="70" y="87" text-anchor="middle" fill="#8a897f" style="font-size:11px">de l’objectif</text>'+
          '</svg>'+
          '<div style="font-size:23px;font-weight:800;margin-top:8px">'+fmtE(realise)+'</div>'+
          '<div style="color:var(--mut);font-size:12px">réalisé sur '+fmtE(objectif)+' TTC</div>'+
          '<div style="display:flex;gap:8px;margin-top:16px">'+
            '<div style="flex:1;background:var(--surface2);border-radius:10px;padding:10px"><div style="color:var(--mut2);font-size:10px;text-transform:uppercase;letter-spacing:.04em">Reste</div><div style="font-weight:700;color:var(--warn);font-size:14px">'+fmtE(reste)+'</div></div>'+
            '<div style="flex:1;background:var(--surface2);border-radius:10px;padding:10px"><div style="color:var(--mut2);font-size:10px;text-transform:uppercase;letter-spacing:.04em">Rythme requis</div><div style="font-weight:700;font-size:14px">'+fmtE(perMonth)+'<span style="color:var(--mut2);font-size:11px">/mois</span></div></div>'+
          '</div>'+
          '<div style="color:var(--mut2);font-size:10.5px;margin-top:12px">'+daysLeft+' j restants en 2026'+(ca.maj?' · maj '+ca.maj:'')+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';
}

async function renderRsvp(){
  const M={contacts:['👤','Contacts'],orgs:['🏢','Organisations'],pipeline:['📈','Pipeline'],projets:['🎯','Projets'],taches:['✅','Tâches'],rh:['👥','RH / Employés'],finances:['💶','Finances'],treso:['💰','Trésorerie'],contenu:['🎬','Contenu'],pilotage:['📊','Pilotage'],emailing:['📣','Emailing']};
  const tiles=(keys,col)=>keys.map(function(k){return moduleTile(k,M[k][0],M[k][1],col);}).join('');
  el('content').innerHTML=pageHead('🍷','RSVP','CRM · Ventes · Opérations · Finances · Marketing')+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px">'+
      famPanel('🤝','CRM & Ventes','var(--rsvp)',tiles(['contacts','orgs','pipeline'],'var(--rsvp)'))+
      famPanel('⚙️','Opérations','var(--immobilier)',tiles(['projets','taches'],'var(--immobilier)'))+
      famPanel('👥','HR','var(--rsvp)',tiles(['rh'],'var(--rsvp)'))+
      famPanel('💶','Finances','var(--warn)',tiles(['finances','treso','pilotage'],'var(--warn)'))+
      famPanel('📣','Marketing','var(--nws)',tiles(['contenu','emailing'],'var(--nws)'))+
    '</div>';
}

async function renderNws(){
  el('content').innerHTML=pageHead('🍇','NWS','Import & négoce de vins')+
    '<div style="background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:52px 24px;text-align:center">'+
      '<div style="font-size:42px;margin-bottom:14px;opacity:.9">🍇</div>'+
      '<div style="font-size:16px;font-weight:700;color:var(--mut)">Univers en préparation</div>'+
      '<div style="font-size:12.5px;margin-top:6px;color:var(--mut2)">À venir : catalogue, marges, commandes, clients pros.</div>'+
    '</div>';
}
